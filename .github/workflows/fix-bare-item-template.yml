name: Fix bare item template
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/fix-bare-item-template.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore ITEM_DB fallback for bare grants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/constants/items.js')
          s=p.read_text()
          old="if (parts.length === 1) return { name, data: { type:'misc' } };"
          new="if (parts.length === 1) return { name, data: ITEM_DB[name] || { type:'misc' } };"
          if old not in s:
              raise SystemExit('bare parseDMItem branch not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/constants/items.js
          git commit -m "fix: restore built-in template for bare item grants"
          git push
