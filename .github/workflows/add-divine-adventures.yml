name: Add divine adventures
on:
  push:
    branches: [astral-encounters]
    paths: ['.github/workflows/add-divine-adventures.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astral-encounters
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python .github/scripts/add_divine_adventures.py
      - run: node --check src/constants/adventures.js
      - run: rm -f .github/scripts/add_divine_adventures.py .github/workflows/add-divine-adventures.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/constants/adventures.js .github/scripts/add_divine_adventures.py .github/workflows/add-divine-adventures.yml
          git commit -m 'Add divine request adventure starters'
          git push origin HEAD:astral-encounters
# one-shot trigger
