name: Refactor prompts
on:
  push:
    branches: [gpt-prompt-split]
    paths: ['.github/workflows/refactor-prompts.yml']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - name: Split prompts
        run: python scripts/refactorPrompts.py
      - name: Commit generated prompt modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js src/App.jsx package.json src/prompts
          git commit -m "Split model prompts into dedicated modules"
          git push
