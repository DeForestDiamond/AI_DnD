name: Refactor stacked items
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/refactor-stacked-items.yml, scripts/refactor_stacked_items.py]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply core refactor
        run: |
          sed -i "s/re.subn(pattern, repl, text/re.subn(pattern, lambda m: repl, text/" scripts/refactor_stacked_items.py
          python scripts/refactor_stacked_items.py
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Find remaining legacy item-model references
        if: always()
        run: |
          echo '=== remaining customItems/stashedCustomItems ==='
          grep -RInE "customItems|stashedCustomItems" src || true
          echo '=== direct string-array inventory assumptions ==='
          grep -RInE "inventory\.(indexOf|includes|filter|some|forEach)|stash\.(indexOf|includes|filter|some|forEach)|\(character\.inventory.*forEach|\(character\.stash.*forEach" src || true
      - name: Commit core refactor
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src
          git commit -m "refactor: introduce stacked item storage and unified registry"
          git push
