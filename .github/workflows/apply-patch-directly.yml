name: Apply patch directly

on:
  push:
    branches: [apply-patches-directly]
    paths:
      - .github/workflows/apply-patch-directly.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apply-patches-directly
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch to real source
        run: node scripts/patchGptNarrativeRules.mjs
      - name: Retire patch from build hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const key of ['predev', 'prebuild']) {
            pkg.scripts[key] = pkg.scripts[key]
              .replace('node scripts/patchGptNarrativeRules.mjs && ', '')
              .replace(' && node scripts/patchGptNarrativeRules.mjs', '');
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Commit applied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply GPT narrative rules directly"
          git push origin HEAD:apply-patches-directly

# migration: narrative-v1
