name: Relax crafting labels
on:
  push:
    branches: [inventory-consolidation]
    paths: ['.github/workflows/relax-crafting-labels.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-consolidation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch crafting prompts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('src/helpers/openai/crafting.js'), Path('src/App.jsx')]
          replacements = [
            (
              'Preserve all meaningful capabilities and properties from the existing label. You may remove redundant prose, ingredient lists, attack-bonus prose, weapon-property boilerplate, and unenforceable mechanics while preserving real capabilities. Add new capabilities clearly without repeating existing ones.',
              'Preserve all meaningful capabilities, properties, and material composition from the existing label. You may trim only genuinely redundant wording, attack-bonus prose, weapon-property boilerplate, and unenforceable mechanics. Do NOT delete what the item is physically made from, because salvage later relies on that provenance. Add new capabilities and newly incorporated materials clearly without erasing existing ones.'
            ),
            (
              '- DO NOT LIST THE RECIPE. The consumes field already records what was used. Never spend label space reciting materials, essences, souls, gems, metals, monster parts, or crafting ingredients. A label like "Adamantine, celestial silver, voidglass, platinum..." is a failure unless one of those words describes a capability that matters during play.\n- Do not pad labels with visual prose, lore, construction history, or generic adjectives. Name and appearance can carry flavor; label space is for useful persistent capabilities.\n- Prefer short semicolon-separated fragments. Simple items may need only one or two fragments. Complex legendary items/constructs may be longer only because they genuinely have more distinct capabilities.',
              '- PRESERVE MATERIAL PROVENANCE. The label should state the item\'s meaningful physical/material composition when it matters for later salvage: major metals, woods, hides, scales, gems/crystals, planar substances, monster materials, cores, and other substantial recoverable construction. Do not list every consumed ingredient or tiny expendable reagent; record what the finished object is actually made from.\n- When upgrading an existing item, preserve its prior material composition and add newly incorporated substantial materials. Never silently remove a material merely to shorten the label unless the player explicitly replaces/removes it in the craft.\n- Do not pad labels with useless visual prose, generic adjectives, or construction history, but keep concise lore/context when it materially explains a persistent capability or unusual construction.\n- Labels should be concise but complete, not aggressively compressed. Prefer readable semicolon-separated clauses. Simple items may be short; complex legendary items, constructs, ships, and heavily upgraded gear may use several sentences or a longer label when needed to preserve distinct capabilities AND material composition.'
            ),
          ]
          changed = []
          for p in files:
            text = p.read_text()
            before = text
            for old,new in replacements:
              text = text.replace(old,new)
            if text != before:
              p.write_text(text)
              changed.append(str(p))
          if 'src/helpers/openai/crafting.js' not in changed:
            raise SystemExit('GPT crafting prompt was not patched')
          print('Patched:', ', '.join(changed))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit source changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/relax-crafting-labels.yml
          git add src/helpers/openai/crafting.js src/App.jsx
          git commit -m "Preserve crafting material provenance and richer labels"
          git push origin inventory-consolidation
