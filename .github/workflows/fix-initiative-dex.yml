name: Fix initiative Dexterity mapping
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch initiative mapping
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/hooks/useGame.js')
          s = p.read_text()
          old = "  acrobatics:'dex', stealth:'dex', sleight:'dex', sleightofhand:'dex',\n"
          new = "  acrobatics:'dex', stealth:'dex', sleight:'dex', sleightofhand:'dex', initiative:'dex',\n"
          if old not in s:
              raise SystemExit('Dex skill map anchor not found; refusing to guess')
          if "initiative:'dex'" in s:
              raise SystemExit('Initiative mapping already present')
          s = s.replace(old, new, 1)
          p.write_text(s)
          assert s.count("initiative:'dex'") == 1
      - name: Build
        run: npm ci && npm run build
      - name: Commit and clean up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-initiative-dex.yml
          git add src/hooks/useGame.js
          git commit -m "Use Dexterity for initiative rolls"
          git push
