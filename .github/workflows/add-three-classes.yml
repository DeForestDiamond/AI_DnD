name: Add three classes
'on':
  push:
    branches: [fix/levelup-progression-6-10]
    paths: [.github/workflows/add-three-classes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch class data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # classes.js — selectable classes + starting gear
          p=Path('src/constants/classes.js'); s=p.read_text()
          class_anchor="  { name:'Druid',       emoji:'🍃',  desc:'Guardian of the natural world, wielding primal magic. WIS-based spellcasting and Wild Shape to transform into beasts.',                                       stats:{str:10,dex:14,con:14,int:10,wis:17,cha:8 } },"
          class_insert="""  { name:'Bard',        emoji:'🎵',  desc:'Versatile performer and full spellcaster. Inspires allies, masters skills, and bends magic through force of personality. CHA primary.', stats:{str:8, dex:14,con:12,int:10,wis:10,cha:17} },
  { name:'Monster Hunter', emoji:'🗡️', desc:'Specialist in hunting supernatural threats. Studies weaknesses, prepares tools and traps, and turns monster lore into lethal precision. DEX and WIS primary.', stats:{str:10,dex:17,con:14,int:12,wis:15,cha:8 } },
  { name:'Gunslinger',  emoji:'🔫',  desc:'Deadly firearm specialist who wins through speed, precision, trick shots, and nerve. DEX primary, WIS secondary.', stats:{str:8, dex:17,con:14,int:10,wis:14,cha:10} },
"""
          if "name:'Bard'" not in s:
            if class_anchor not in s: raise SystemExit('class anchor missing')
            s=s.replace(class_anchor, class_anchor+'\n'+class_insert,1)
          gear_anchor="  Druid:        { slots:{ ...EMPTY_SLOTS, mainhand:'Quarterstaff', offhand:'Shield' },                     inventory:['Druidic Focus','Herbalism Kit','Torch','Rations','Rations','Rations'] },"
          gear_insert="""  Bard:         { slots:{ ...EMPTY_SLOTS, mainhand:'Rapier', armor:'Leather Armor' },                    inventory:['Lute','Dagger','Torch','Rations','Rations','Rations'] },
  'Monster Hunter': { slots:{ ...EMPTY_SLOTS, mainhand:'Longsword', armor:'Studded Leather' },                  inventory:['Hand Crossbow',\"Hunter's Kit\",'Torch','Rations','Rations','Rations'] },
  Gunslinger:    { slots:{ ...EMPTY_SLOTS, mainhand:'Pistol', armor:'Leather Armor' },                         inventory:['Dagger','Gunsmith Tools','Torch','Rations','Rations','Rations'] },
"""
          if '  Bard:         { slots:' not in s:
            if gear_anchor not in s: raise SystemExit('gear anchor missing')
            s=s.replace(gear_anchor, gear_anchor+'\n'+gear_insert,1)
          p.write_text(s)

          # items.js — templates needed for starting gear injection
          p=Path('src/constants/items.js'); s=p.read_text()
          if "'Pistol':" not in s:
            anchor="  'Arcane Pistol': { type:'weapon', damage:'1d10', bonus:0, finesse:false, range:'ranged', label:'INT-based, arcane focus, no ammo required' },"
            ins="  'Pistol':        { type:'weapon', damage:'1d10', bonus:0, finesse:true, range:'ranged', label:'DEX-based firearm' },\n"
            if anchor not in s: raise SystemExit('weapon anchor missing')
            s=s.replace(anchor, ins+anchor,1)
          # Add mundane focus/tools templates so starting characters carry useful definitions.
          focus_anchor='export const FOCUS_DB = {'
          if "'Lute':" not in s:
            s=s.replace(focus_anchor, focus_anchor+"\n  'Lute':                    { type:'focus', slot:'mainhand', bonuses:{}, label:'Bardic spellcasting focus and musical instrument' },",1)
          # ITEM_DB can include misc tool definitions through a small gear DB.
          if 'export const GEAR_DB' not in s:
            magic_end='};\n\nexport const FOCUS_DB = {'
            gear="""};

export const GEAR_DB = {
  'Gunsmith Tools': { type:'misc', label:'Tools for maintaining, repairing, and modifying firearms' },
  \"Hunter's Kit\": { type:'misc', label:'Specialized tools, reagents, traps, and field supplies for hunting monsters' },
};

export const FOCUS_DB = {"""
            if magic_end not in s: raise SystemExit('magic/focus boundary missing')
            s=s.replace(magic_end,gear,1)
          s=s.replace('export const ITEM_DB = { ...WEAPON_DB, ...ARMOR_DB, ...MAGIC_ITEM_DB, ...FOCUS_DB };','export const ITEM_DB = { ...WEAPON_DB, ...ARMOR_DB, ...MAGIC_ITEM_DB, ...GEAR_DB, ...FOCUS_DB };')
          p.write_text(s)

          # progression.js — HP math tables
          p=Path('src/constants/progression.js'); s=p.read_text()
          s=s.replace("'Blood Hunter':5, Sorcerer:4, Druid:5 }", "'Blood Hunter':5, Sorcerer:4, Druid:5, Bard:5, 'Monster Hunter':6, Gunslinger:5 }")
          s=s.replace("'Blood Hunter':8, Sorcerer:6, Druid:8 }", "'Blood Hunter':8, Sorcerer:6, Druid:8, Bard:8, 'Monster Hunter':10, Gunslinger:8 }")
          p.write_text(s)

          # multiclass.js — full 1-10 progression
          p=Path('src/constants/multiclass.js'); s=p.read_text()
          if '\n  Bard: {' not in s:
            anchor='\n};\n\n// Sneak attack dice by total rogue levels'
            blocks=r'''
  Bard: {
    emoji: '🎵',
    desc: 'Versatile CHA caster and master of inspiration, performance, and skill.',
    hpPerLevel: 5,
    features: {
      1: ['Bardic Inspiration - grant an ally a die they can add to a crucial roll', 'Spellcasting - CHA-based bard magic'],
      2: ['Jack of All Trades - add partial proficiency to skills you do not already know', 'Song of Rest - improve recovery during rests'],
      3: ['Bard College subclass', 'Expertise - double proficiency in chosen skills'],
      4: ['Ability Score Improvement'],
      5: ['Font of Inspiration - Bardic Inspiration returns on a short rest', 'Bardic Inspiration die improves'],
      6: ['Countercharm - performance shields allies from fear and charm', 'Magical Secrets - learn magic from another class'],
      7: ['Bardic Inspiration improves again'],
      8: ['Expertise improves - master additional skills'],
      9: ['Superior Inspiration - recover inspiration when entering a crisis empty'],
      10: ['Peerless Bard - peak inspiration, magical secrets, and performance magic'],
    },
  },
  'Monster Hunter': {
    emoji: '🗡️',
    desc: 'Prepared supernatural predator. Study the quarry, exploit weaknesses, and survive what should kill you.',
    hpPerLevel: 6,
    features: {
      1: ["Hunter's Lore - identify supernatural creatures, signs, habits, and likely weaknesses", 'Prepared Arsenal - carry specialized oils, traps, wards, and hunting tools'],
      2: ['Marked Quarry - focus on one creature and relentlessly track its movement and tells', 'Monster Slayer - exploit a discovered weakness for additional damage'],
      3: ['Hunter Discipline subclass', 'Field Preparation - improvise effective countermeasures from local materials'],
      4: ['Ability Score Improvement'],
      5: ['Extra Attack', 'Hardened Hunter - improved resistance to fear, charm, poison, and supernatural coercion'],
      6: ['Relentless Pursuit - track marked prey across hostile terrain and planar boundaries'],
      7: ['Exploit Weakness - once a vulnerability is identified, your attacks and plans capitalize on it decisively'],
      8: ['Unnatural Resilience - endure curses, transformations, possession, and monster-inflicted afflictions'],
      9: ['Apex Quarry - maintain pressure on legendary prey that teleport, regenerate, or change form'],
      10: ['Legendary Hunter - rapidly identify unknown monsters and prepare a viable method to kill or contain them'],
    },
  },
  Gunslinger: {
    emoji: '🔫',
    desc: 'DEX firearm specialist using grit, speed, precision, and trick shots.',
    hpPerLevel: 5,
    features: {
      1: ['Firearm Proficiency', 'Grit - fuel daring firearm techniques through nerve and precision', 'Quick Draw - draw or swap firearms instantly when action matters'],
      2: ['Trick Shots - disarm, push, stagger, or target weak points with called shots'],
      3: ['Gunslinger Archetype subclass', 'Deadeye - spend grit for exceptional accuracy'],
      4: ['Ability Score Improvement'],
      5: ['Extra Attack', 'Fast Reload - reload or clear routine firearm problems without losing momentum'],
      6: ['Piercing Shot - line up multiple targets or punch through cover with a powerful shot'],
      7: ['Evasive Footwork - reposition under fire without surrendering your shot'],
      8: ['Vicious Intent - critical firearm hits become more devastating'],
      9: ['Hemorrhaging Critical - severe hits inflict lasting wounds that demand immediate attention'],
      10: ['Legendary Gunslinger - unmatched draw speed, grit recovery, and firearm precision'],
    },
  },
'''
            if anchor not in s: raise SystemExit('multiclass end anchor missing')
            s=s.replace(anchor,blocks+anchor,1)
          p.write_text(s)

          # abilities.js — Bard spell list + martial selections for all three.
          p=Path('src/constants/abilities.js'); s=p.read_text()
          if '\n  Bard: {' not in s:
            end='\n};\n\n// '
            idx=s.find(end)
            if idx<0: raise SystemExit('abilities object end missing')
            blocks=r'''

  Bard: {
    cantrips: ['Dancing Lights','Friends','Light','Mage Hand','Mending','Message','Minor Illusion','Prestidigitation','True Strike','Vicious Mockery'],
    martial: {
      1: ['Bardic Inspiration'], 2: ['Jack of All Trades','Song of Rest'], 3: ['Expertise'], 4: ['Versatile Performance'],
      5: ['Font of Inspiration'], 6: ['Countercharm','Magical Secrets'], 7: ['Improved Inspiration'], 8: ['Additional Expertise'],
      9: ['Superior Inspiration'], 10: ['Peerless Performance'],
    },
    martialKnown: {1:1,2:2,3:1,4:1,5:1,6:2,7:1,8:1,9:1,10:1},
    spells: {
      1: ['Charm Person','Comprehend Languages','Cure Wounds','Detect Magic','Disguise Self','Dissonant Whispers','Faerie Fire','Feather Fall','Healing Word','Heroism','Sleep','Speak with Animals','Thunderwave'],
      2: ['Calm Emotions','Detect Thoughts','Enhance Ability','Enthrall','Hold Person','Invisibility','Knock','Lesser Restoration','Locate Object','See Invisibility','Shatter','Silence','Suggestion'],
      3: ['Clairvoyance','Dispel Magic','Fear','Glyph of Warding','Hypnotic Pattern','Major Image','Plant Growth','Sending','Speak with Dead','Tongues'],
      4: ['Dimension Door','Freedom of Movement','Greater Invisibility','Hallucinatory Terrain','Locate Creature','Polymorph'],
      5: ['Animate Objects','Awaken','Dominate Person','Geas','Greater Restoration','Hold Monster','Legend Lore','Mass Cure Wounds','Raise Dead','Scrying'],
      6: ['Mass Suggestion','Otto\'s Irresistible Dance','True Seeing'],
      7: ['Etherealness','Forcecage','Mirage Arcane','Teleport'],
      8: ['Dominate Monster','Feeblemind','Glibness','Mind Blank'],
      9: ['Foresight','Power Word Heal','True Polymorph'],
      10: ['Magical Secrets','Peerless Inspiration'],
    },
    cantripsKnown:{1:2,2:2,3:2,4:3,5:3,6:3,7:3,8:4,9:4,10:4},
    spellsKnown:{1:4,2:5,3:6,4:7,5:8,6:10,7:12,8:14,9:16,10:18},
  },

  'Monster Hunter': {
    cantrips: [],
    martial: {
      1:["Hunter's Lore",'Prepared Arsenal'], 2:['Marked Quarry','Monster Slayer'], 3:['Field Preparation'], 4:['Ability Score Improvement'],
      5:['Extra Attack','Hardened Hunter'], 6:['Relentless Pursuit'], 7:['Exploit Weakness'], 8:['Unnatural Resilience'], 9:['Apex Quarry'], 10:['Legendary Hunter'],
    },
    martialKnown:{1:2,2:2,3:1,4:1,5:2,6:1,7:1,8:1,9:1,10:1},
  },

  Gunslinger: {
    cantrips: [],
    martial: {
      1:['Grit','Quick Draw','Firearm Proficiency'], 2:['Deadeye Shot','Disarming Shot','Forceful Shot'], 3:['Trick Shot Mastery'], 4:['Ability Score Improvement'],
      5:['Extra Attack','Fast Reload'], 6:['Piercing Shot'], 7:['Evasive Footwork'], 8:['Vicious Intent'], 9:['Hemorrhaging Critical'], 10:['Legendary Gunslinger'],
    },
    martialKnown:{1:3,2:3,3:1,4:1,5:2,6:1,7:1,8:1,9:1,10:1},
  },'''
            s=s[:idx]+blocks+s[idx:]
          p.write_text(s)

          # subclasses.js — choices at tier 3 for all three, Bard included in pick table.
          p=Path('src/constants/subclasses.js'); s=p.read_text()
          s=s.replace("Sorcerer: 1, Druid: 2,", "Sorcerer: 1, Druid: 2, Bard: 3, 'Monster Hunter': 3, Gunslinger: 3,")
          if '\n  Bard: {' not in s:
            anchor='export const SUBCLASSES = {\n'
            sub=r'''  Bard: {
    'College of Lore': { emoji:'📚', desc:'Collector of secrets, skills, and stolen magic.', features:[
      {name:'Bonus Proficiencies',desc:'Gain broader expertise across skills and knowledge.'},
      {name:'Cutting Words',desc:'Spend Bardic Inspiration to undermine an enemy\'s attack, check, or damage.'},
      {name:'Additional Magical Secrets',desc:'Learn powerful magic normally unavailable to bards.'},
    ]},
    'College of Valor': { emoji:'⚔️', desc:'Battlefield bard who turns inspiration into martial courage.', features:[
      {name:'Combat Inspiration',desc:'Allies can spend inspiration to improve weapon damage or defense.'},
      {name:'Battle Magic',desc:'Weave spellcasting and weapon attacks together fluidly.'},
    ]},
  },
  'Monster Hunter': {
    'Occult Slayer': { emoji:'🕯️', desc:'Specialist in curses, undead, fiends, and hostile magic.', features:[
      {name:'Warded Mind',desc:'Harden yourself against charm, possession, and supernatural intrusion.'},
      {name:'Ritual Countermeasures',desc:'Prepare wards, circles, salts, oils, and banes against identified prey.'},
    ]},
    'Beast Stalker': { emoji:'🐾', desc:'Tracks apex monsters through wilderness and ruins until nowhere remains safe.', features:[
      {name:'Predator Tracking',desc:'Read impossible trails, spoor, feeding signs, and territorial behavior.'},
      {name:'Ambush Preparation',desc:'Build traps and choose terrain specifically to counter your quarry.'},
    ]},
  },
  Gunslinger: {
    'Deadeye': { emoji:'🎯', desc:'Precision shooter who wins fights with one impossible shot.', features:[
      {name:'Called Shot',desc:'Spend grit to attack a specific weak point or piece of equipment.'},
      {name:'Steady Aim',desc:'Trade movement for extreme accuracy when the shot matters.'},
    ]},
    'Pistolero': { emoji:'💨', desc:'Fast, aggressive close-range gunfighter built around movement and draw speed.', features:[
      {name:'Fan the Hammer',desc:'Unleash a rapid burst of close-range shots at the cost of control.'},
      {name:'Lightning Draw',desc:'React to danger with a firearm before slower opponents can act.'},
    ]},
  },
'''
            if anchor not in s: raise SystemExit('subclass anchor missing')
            s=s.replace(anchor,anchor+sub,1)
          p.write_text(s)

          # App.jsx — Bard needs spell picker/post-load handling.
          p=Path('src/App.jsx'); s=p.read_text()
          s=s.replace("['Artificer','Cleric','Wizard','Warlock','Sorcerer','Druid','Paladin','Ranger']", "['Artificer','Cleric','Wizard','Warlock','Sorcerer','Druid','Paladin','Ranger','Bard']")
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Audit class integration
        run: |
          python - <<'PY'
          from pathlib import Path
          classes=['Bard','Monster Hunter','Gunslinger']
          files={p:Path(p).read_text() for p in ['src/constants/classes.js','src/constants/progression.js','src/constants/multiclass.js','src/constants/abilities.js','src/constants/subclasses.js']}
          for cls in classes:
            for p,s in files.items():
              assert cls in s, f'{cls} missing from {p}'
          import re
          s=files['src/constants/multiclass.js']
          for cls in classes:
            pat = rf"'{re.escape(cls)}':\s*\{{" if ' ' in cls else rf'{cls}:\s*\{{'
            m=re.search(pat,s); assert m, cls
            start=s.find('features:',m.start()); end=s.find('\n    },',start); block=s[start:end]
            missing=[n for n in range(1,11) if not re.search(rf'\n\s*{n}:\s*\[',block)]
            assert not missing, f'{cls} missing progression {missing}'
          print('New classes integrated and have 1-10 progression')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/constants/classes.js src/constants/items.js src/constants/progression.js src/constants/multiclass.js src/constants/abilities.js src/constants/subclasses.js src/App.jsx
          git commit -m "feat: add Bard Monster Hunter and Gunslinger"
          git push
