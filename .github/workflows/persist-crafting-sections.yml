name: Persist crafting section state
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch crafting section state
        run: python .github/scripts/persist_crafting_sections.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/sidebar/common/index.jsx src/components/sidebar/crafting/Panels.jsx
          git commit -m "Persist crafting section open state"
          git push
