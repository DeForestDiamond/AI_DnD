name: Run system prompt audit cleanup
on:
  push:
    branches:
      - refactor/system-prompt-audit
    paths:
      - scripts/prompt_audit_cleanup.py
      - .github/workflows/run-prompt-audit-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prompt_audit_cleanup.py
      - run: npm ci
      - run: npm run build
      - name: Audit prompt source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/hooks/useGame.js').read_text()
          assert s.count('const PLAYSTYLE_BY_CLASS') == 1
          for cls in ['Fighter','Wizard','Rogue','Cleric','Artificer','Illrigger','Monk','Barbarian','Warlock','Blood Hunter','Paladin','Ranger','Sorcerer','Druid','Bard','Monster Hunter','Gunslinger']:
              assert cls in s, cls
          assert 'const itemDetailLine' not in s
          assert '[UPDATE:' not in s
          assert "face, head, neck, shoulders, cloak, torso, arms, hands, waist" in s
          assert "const objectivesSection = '';" in s
          print('prompt audit guards passed')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/hooks/useGame.js
          git commit -m "refactor: clean up system prompt scaffolding"
          git push
