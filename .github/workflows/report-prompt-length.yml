name: Inspect prompt length instruction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract prompt length context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/hooks/useGame.js').read_text()
          lines = s.splitlines()
          hits=[]
          for i,line in enumerate(lines):
              low=line.lower()
              if 'paragraph' in low or 'word' in low and ('response' in low or 'length' in low) or 'short' in low and 'response' in low:
                  a=max(0,i-4); b=min(len(lines),i+5)
                  hits.append(f'--- hit line {i+1} ---\n'+'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
          Path('prompt-length-report.txt').write_text('\n\n'.join(hits) or 'NO HITS')
          PY
      - name: Commit report and clean workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/report-prompt-length.yml
          git add prompt-length-report.txt
          git commit -m "chore: report prompt length instruction"
          git push