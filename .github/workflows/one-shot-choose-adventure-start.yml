name: One-shot choose adventure start

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add Choose Adventure start option
        run: node scripts/oneShotChooseAdventureStart.mjs
      - name: Build
        run: npm ci && npm run build
      - name: Commit direct source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/modals/StartModal.jsx src/constants/adventures.js
          git diff --cached --quiet && exit 0
          git commit -m "Add Choose Adventure start option"
          git push origin HEAD:main
