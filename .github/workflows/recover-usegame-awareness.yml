name: Recover useGame and tighten awareness hooks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore known-good useGame and patch awareness hook rule
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          good = subprocess.check_output([
              'git','show','95e808cb89bd75080252091f58d19c9c38636b26:src/hooks/useGame.js'
          ], text=True)

          old = '''THE ACTIVE ARC MUST REMAIN PRESENT AND PROGRESS THROUGH THE WORLD, BUT DO NOT CONSTANTLY PUSH THE PLAYER DIRECTLY TOWARD THE ANTAGONIST. Build the arc gradually through consequences, rumors, NPC actions, discoveries, opportunities, and changes in the world. Allow breathing room between arc beats. Side quests, businesses, personal goals, and detours are allowed to breathe on their own; they do not need an antagonist clue stapled onto every scene. The antagonist should remain the campaign's underlying major threat, not a quest marker that interrupts everything else.\n\nUSE THREE STAGES: AWARENESS -> INVESTMENT -> PURSUIT.\nAWARENESS: Let the player learn that something is happening through organic signs, rumors, victims, agents, consequences, or changes in the world. Do not assume awareness creates obligation.'''

          new = '''THE ACTIVE ARC MUST REMAIN PRESENT AND PROGRESS THROUGH THE WORLD, BUT DO NOT CONSTANTLY PUSH THE PLAYER DIRECTLY TOWARD THE ANTAGONIST. Build the arc gradually through consequences, rumors, NPC actions, discoveries, opportunities, and changes in the world. Allow breathing room between arc beats. PLAYER-INITIATED side quests, businesses, personal goals, and detours are allowed to breathe on their own; they do not need an antagonist clue stapled onto every scene. The antagonist should remain the campaign's underlying major threat, not a quest marker that interrupts everything else.\n\nUSE THREE STAGES: AWARENESS -> INVESTMENT -> PURSUIT.\nAWARENESS: Let the player learn that something is happening through organic signs, rumors, victims, agents, consequences, or changes in the world. Do not assume awareness creates obligation. WHEN INTRODUCING AN ARC HOOK, DO NOT SUBSTITUTE A LOCAL QUEST. If you introduce a suspicious event, rumor, missing person or ship, job, attack, victim, witness, notice, or other potential adventure hook to surface the active arc, that hook MUST originate from or meaningfully connect to the assigned antagonist and ARC LOCATION. The player's current location is only where they LEARN about it. Do not convert an Astral, planar, distant, or foreign arc into a local version merely because the player is currently elsewhere. Example: if the arc concerns Astral pirates and the player is in Baldur's Gate, a crier may report missing SPELLJAMMERS, planar travelers, survivors, or cargo lost in the Astral; do NOT invent unrelated missing coastal ships around Baldur's Gate.'''

          if old not in good:
              raise SystemExit('Expected awareness anchor not found in known-good useGame.js')

          patched = good.replace(old, new, 1)
          p = Path('src/hooks/useGame.js')
          p.write_text(patched)

          assert 'PLAYER-INITIATED side quests' in patched
          assert 'DO NOT SUBSTITUTE A LOCAL QUEST' in patched
          assert 'missing SPELLJAMMERS' in patched
          assert len(patched.splitlines()) > 1200
      - name: Build
        run: npm ci && npm run build
      - name: Commit recovery and patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/recover-usegame-awareness.yml
          git add src/hooks/useGame.js
          git commit -m "Recover useGame and require arc-aware hooks"
          git push