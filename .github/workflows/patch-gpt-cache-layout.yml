name: Patch GPT cache layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move arc policy into stable prompt and add cache diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/hooks/useGame.js')
          s = p.read_text()

          # Extract the existing arc policy from the volatile arcLine without
          # rewriting its wording. Keep only antagonist + arc location dynamic.
          anchor = "  const arcLine = char.arc?.antagonist\n    ? `"
          a = s.index(anchor)
          inner_start = a + len(anchor)
          inner_end = s.index("`\n    : '';", inner_start)
          inner = s[inner_start:inner_end]
          marker = "${char.arc.arcLocation || 'Faerûn'}."
          cut = inner.index(marker) + len(marker)
          dynamic_arc = inner[:cut]
          policy = inner[cut:].lstrip()
          if not policy.startswith('THIS IS WHERE THE SUBSTANTIVE ARC HAPPENS'):
              raise SystemExit('Unexpected arc policy split point')
          if '`' in policy or '${' in policy:
              raise SystemExit('Arc policy unexpectedly contains template syntax')

          s = s[:inner_start] + dynamic_arc + s[inner_end:]

          # Put the extracted policy in a stable constant before the shared
          # setting block. Both Haiku and Sonnet/GPT prompts already include
          # SETTING_BLOCK, so inject ARC_RULES_BLOCK immediately before it.
          setting_anchor = "// ── Shared setting/geography (both models)"
          pos = s.index(setting_anchor)
          arc_const = (
              "// ── Shared arc policy (stable; antagonist/location stay dynamic) ───────────────\n"
              "const ARC_RULES_BLOCK = `── ARC RULES ──\\n" + policy.replace('\\', '\\\\') + "`;\n\n"
          )
          s = s[:pos] + arc_const + s[pos:]

          prompt_pair = "${SETTING_BLOCK}\\n\\n${NPC_BLOCK}"
          count = s.count(prompt_pair)
          if count < 1:
              raise SystemExit('Could not find setting/NPC prompt insertion point')
          s = s.replace(prompt_pair, "${ARC_RULES_BLOCK}\\n\\n${SETTING_BLOCK}\\n\\n${NPC_BLOCK}")

          # Add actual OpenAI cache accounting to the debug log. The existing
          # [PROMPT] line is only our size estimate; this line reports API usage.
          usage_anchor = "      const usage = {\n        input_tokens: Math.max(0, totalInput - cached - cacheWrite),"
          if usage_anchor not in s:
              raise SystemExit('OpenAI usage anchor not found')
          log_insert_anchor = "      if (promptRecord) onPrompt({ ...promptRecord, usage });"
          if log_insert_anchor not in s:
              raise SystemExit('OpenAI promptRecord anchor not found')
          cache_log = (
              "      if (log) log(`[CACHE] OpenAI actual: total ${totalInput.toLocaleString()} · cached ${cached.toLocaleString()} · write ${cacheWrite.toLocaleString()} · uncached ${Math.max(0, totalInput - cached - cacheWrite).toLocaleString()}`);\n"
          )
          s = s.replace(log_insert_anchor, cache_log + log_insert_anchor, 1)

          p.write_text(s)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-gpt-cache-layout.yml
          git add src/hooks/useGame.js
          git commit -m "Optimize GPT prompt cache layout"
          git push
