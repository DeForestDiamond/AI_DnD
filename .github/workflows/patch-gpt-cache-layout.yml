name: Patch GPT cache layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move arc policy into stable prompt and add cache diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/hooks/useGame.js')
          s = p.read_text()

          anchor = "  const arcLine = char.arc?.antagonist\n    ? `"
          if anchor not in s:
              raise SystemExit('arcLine anchor not found')
          a = s.index(anchor)
          inner_start = a + len(anchor)
          inner_end = s.index("`\n    : '';", inner_start)
          inner = s[inner_start:inner_end]
          marker = "${char.arc.arcLocation || 'Faerûn'}."
          if marker not in inner:
              raise SystemExit('arc location marker not found')
          cut = inner.index(marker) + len(marker)
          dynamic_arc = inner[:cut]
          policy = inner[cut:].lstrip()
          if len(policy) < 1000:
              raise SystemExit(f'Arc policy unexpectedly short: {len(policy)} chars')
          if '`' in policy or '${' in policy:
              raise SystemExit('Arc policy contains template syntax; refusing unsafe move')
          s = s[:inner_start] + dynamic_arc + s[inner_end:]

          setting_anchor = "// ── Shared setting/geography (both models)"
          if setting_anchor not in s:
              raise SystemExit('setting block declaration anchor not found')
          pos = s.index(setting_anchor)
          arc_const = "// ── Shared arc policy (stable; antagonist/location stay dynamic) ───────────────\nconst ARC_RULES_BLOCK = `── ARC RULES ──\n" + policy + "`;\n\n"
          s = s[:pos] + arc_const + s[pos:]

          # Add the stable arc policy anywhere the shared setting block is emitted.
          token = "${SETTING_BLOCK}"
          uses = s.count(token)
          if uses < 1:
              raise SystemExit('No SETTING_BLOCK prompt use found')
          s = s.replace(token, "${ARC_RULES_BLOCK}\\n\\n${SETTING_BLOCK}")

          # Actual API cache accounting, distinct from our prompt-size estimate.
          log_anchor = "      if (promptRecord) onPrompt({ ...promptRecord, usage });"
          if log_anchor not in s:
              raise SystemExit('OpenAI promptRecord anchor not found')
          cache_log = "      if (log) log(`[CACHE] OpenAI actual: total ${totalInput.toLocaleString()} · cached ${cached.toLocaleString()} · write ${cacheWrite.toLocaleString()} · uncached ${Math.max(0, totalInput - cached - cacheWrite).toLocaleString()}`);\n"
          s = s.replace(log_anchor, cache_log + log_anchor, 1)

          p.write_text(s)
          print(f'Moved {len(policy)} chars of arc policy to stable prompt; injected before {uses} setting-block use(s).')
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-gpt-cache-layout.yml
          git add src/hooks/useGame.js
          git commit -m "Optimize GPT prompt cache layout"
          git push
