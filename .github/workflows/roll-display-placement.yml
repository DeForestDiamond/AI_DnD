name: Roll display placement fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN ROLL DISPLAY PLACEMENT FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patchRollDisplayPlacement.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify roll placement
        run: |
          grep -q "roll: skillRoll || null" src/App.jsx
          grep -q "let finalRoll = actionRoll || null" src/App.jsx
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Show DM-requested roll results"
          git push origin HEAD:main
