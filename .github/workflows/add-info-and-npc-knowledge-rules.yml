name: Add information and NPC knowledge rules

on:
  push:
    branches: [divine-deity-roll]
    paths:
      - '.github/workflows/add-info-and-npc-knowledge-rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: divine-deity-roll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/add_info_and_npc_knowledge_rules.py
      - run: node --check src/hooks/useGame.js
      - name: Verify rules present once
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/hooks/useGame.js').read_text()
          assert s.count('── INFORMATION MUST BE EARNED ──') == 1
          assert s.count('── NPC KNOWLEDGE IS NOT DM KNOWLEDGE ──') == 1
          print('prompt rules verified')
          PY
      - run: rm -f .github/scripts/add_info_and_npc_knowledge_rules.py .github/workflows/add-info-and-npc-knowledge-rules.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate information and NPC equipment knowledge' || exit 0
          git push origin HEAD:divine-deity-roll
