name: Run banked coin patch

on:
  push:
    paths:
      - 'scripts/patchBankedCoins.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patchBankedCoins.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify DM cannot see banked wealth
        run: |
          if grep -n "bankedCoins" src/hooks/useGame.js; then
            echo 'bankedCoins leaked into DM prompt code'
            exit 1
          fi
          grep -q "SAVE_VERSION = 20" src/constants/progression.js
          grep -q "bankedCoins:0" src/hooks/useCharacter.js
          grep -q "onBankCoins={bankCoins}" src/App.jsx
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants/progression.js src/hooks/useCharacter.js src/components/Sidebar.jsx src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Add private banked coin storage"
          git push origin HEAD:main
