name: Run deferred level-up refactor
on:
  push:
    branches:
      - feat/deferred-level-up-sidebar
    paths:
      - scripts/deferred_levelup_patch.py
      - .github/workflows/run-deferred-levelup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/deferred_levelup_patch.py
      - run: npm ci
      - run: npm run build
      - name: Audit level-up architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          u=Path('src/hooks/useCharacter.js').read_text()
          a=Path('src/App.jsx').read_text()
          s=Path('src/components/Sidebar.jsx').read_text()
          assert 'export const levelUpsAvailable' in u
          assert 'pendingStatPoint' not in u
          assert 'levelUpMsg' not in u
          assert 'checkLevelUp' not in u
          assert 'level:(c.level || 1) + 1' in u
          assert 'MulticlassModal' not in a
          assert 'bankedLevelUps' in a
          assert "['levelup'" in s
          assert 'MULTICLASS INTO' in s
          assert 'LEVEL UP' in s
          print('deferred level-up audit passed')
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/hooks/useCharacter.js src/components/Sidebar.jsx src/App.jsx
          git commit -m "feat: move level-up flow into sidebar"
          git push
