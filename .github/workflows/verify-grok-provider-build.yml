name: Verify Grok provider build

on:
  push:
    branches:
      - grok-provider
    paths:
      - '.github/workflows/verify-grok-provider-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: grok-provider
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Remove temporary verifier
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/verify-grok-provider-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary Grok build verifier"
          git push origin HEAD:grok-provider
