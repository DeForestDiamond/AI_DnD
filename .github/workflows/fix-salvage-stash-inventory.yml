name: Fix salvage stash inventory corruption

on:
  push:
    branches: [divine-deity-roll]
    paths:
      - '.github/workflows/fix-salvage-stash-inventory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: divine-deity-roll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_salvage_stash_inventory.py
      - run: npm ci
      - run: npm run build
      - name: Verify salvage destination assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text()
          good = "inventory: takeStack(next.inventory, recovered.name, count).stacks,"
          bad = "inventory: takeStack(next.inventory, recovered.name, count),"
          assert s.count(good) == 1
          assert bad not in s
          print('salvage stash assignment verified')
          PY
      - name: Stack helper regression smoke test
        run: |
          node --input-type=module <<'NODE'
          import { addStack, takeStack, stackCount } from './src/utils/itemStacks.js';
          const before = [{name:'Keep Me',qty:1},{name:'Recovered',qty:2}];
          const inventory = takeStack(before, 'Recovered', 2).stacks;
          const stash = addStack([], 'Recovered', 2);
          if (stackCount(inventory, 'Keep Me') !== 1) throw new Error('unselected inventory entry disappeared');
          if (stackCount(inventory, 'Recovered') !== 0) throw new Error('recovered material was not removed from inventory');
          if (stackCount(stash, 'Recovered') !== 2) throw new Error('recovered material was not moved to stash');
          console.log('stack move preserves unrelated inventory entries');
          NODE
      - run: rm -f .github/scripts/fix_salvage_stash_inventory.py .github/workflows/fix-salvage-stash-inventory.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix salvage to stash inventory corruption' || exit 0
          git push origin HEAD:divine-deity-roll
