name: Add character appearance
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply appearance patch
        run: python .github/scripts/add_character_appearance.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx src/components/Sidebar.jsx src/components/sidebar/world/Panels.jsx src/hooks/character/useCharacter.js src/hooks/character/defaults.js src/hooks/character/migration.js src/constants/progression.js src/prompts/state.js
          git commit -m "Add physical appearance to characters"
          git push
