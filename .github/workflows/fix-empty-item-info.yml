name: Fix empty item info markers
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/fix-empty-item-info.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch meaningful item info predicate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Sidebar.jsx')
          s = p.read_text()
          anchor = "const CATEGORY_META = {"
          helper = "const hasInspectableItemInfo = (d) => {\n  if (!d) return false;\n  if (d.label?.trim()) return true;\n  if (d.slot) return true;\n  if (d.ac !== undefined) return true;\n  if (d.damage) return true;\n  if (d.bonus) return true;\n  if (Array.isArray(d.extras) && d.extras.length) return true;\n  if (d.bonuses && Object.keys(d.bonuses).length) return true;\n  if (d.type && d.type !== 'misc') return true;\n  return false;\n};\n\n"
          if 'const hasInspectableItemInfo' not in s:
              if anchor not in s:
                  raise SystemExit('category anchor missing')
              s = s.replace(anchor, helper + anchor, 1)
          old_cursor = "cursor:stockData(nm)?'pointer':'default'"
          old_marker = "{stockData(nm) && <span style={{color:colors.textDead,fontSize:10}}> ⓘ</span>}"
          old_click = "<span onClick={()=>setInfoOpen(p => ({ ...p, [nm]: !p[nm] }))}"
          if s.count(old_cursor) != 2:
              raise SystemExit(f'expected 2 cursor predicates, found {s.count(old_cursor)}')
          if s.count(old_marker) != 2:
              raise SystemExit(f'expected 2 marker predicates, found {s.count(old_marker)}')
          if s.count(old_click) != 2:
              raise SystemExit(f'expected 2 click handlers, found {s.count(old_click)}')
          s = s.replace(old_cursor, "cursor:hasInspectableItemInfo(stockData(nm))?'pointer':'default'")
          s = s.replace(old_marker, "{hasInspectableItemInfo(stockData(nm)) && <span style={{color:colors.textDead,fontSize:10}}> ⓘ</span>}")
          s = s.replace(old_click, "<span onClick={()=>{ if (hasInspectableItemInfo(stockData(nm))) setInfoOpen(p => ({ ...p, [nm]: !p[nm] })); }}")
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/Sidebar.jsx
          git commit -m "fix: hide empty item info markers"
          git push
