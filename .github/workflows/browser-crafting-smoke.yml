name: Browser crafting smoke
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/browser-crafting-smoke.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Create browser harness
        run: |
          cat > smoke.html <<'HTML'
          <div id="root"></div><script type="module" src="/smoke.jsx"></script>
          HTML
          cat > smoke.jsx <<'JS'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { Sidebar } from './src/components/Sidebar.jsx';
          const character={
            name:'Fresh',stats:{str:10,dex:14,con:10,int:16,wis:10,cha:10},level:1,xp:0,hp:10,maxHp:10,
            cls:{name:'Artificer'},race:{name:'Human'},classLevels:{Artificer:1},subclasses:{},abilities:{cantrips:[],spells:[],infusions:[],martial:[]},
            slots:{mainhand:'Arcane Pistol',offhand:null,armor:null,head:null,neck:null,cloak:null,hands:null,ring1:null,ring2:null,feet:null,face:null,shoulders:null,torso:null,arms:null,waist:null},
            inventory:[{name:'Iron Ingot',qty:300000},{name:'Test Bag',qty:1}],stash:[{name:'Mithral Plate',qty:12}],coins:1000,
            companions:{},npcs:{},towns:{},contextExclusions:{companions:{},npcs:{},towns:{}},
            items:{'Iron Ingot':{type:'misc'},'Mithral Plate':{type:'misc'},'Arcane Pistol':{type:'weapon',damage:'1d10'},'Test Bag':{type:'bag',contents:{'Copper Wire':5},label:'Copper Wire x5'},'Copper Wire':{type:'misc'}}
          };
          window.__errs=[]; window.addEventListener('error',e=>window.__errs.push(String(e.error||e.message))); window.addEventListener('unhandledrejection',e=>window.__errs.push(String(e.reason)));
          createRoot(document.getElementById('root')).render(<Sidebar character={character} onSaveClick={()=>{}} onProposeCrafting={async()=>[]} onExecuteCrafting={()=>''} onProposeDismantle={async()=>({recovers:[]})} onExecuteDismantle={()=>''} selectedModel="gpt"/>);
          JS
          cat > browser-smoke.mjs <<'JS'
          import { chromium, devices } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({...devices['Pixel 7']});
          const page=await context.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
          await page.goto('http://127.0.0.1:4173/smoke.html');
          await page.getByRole('button',{name:/CRAFTING/}).click();
          await page.waitForTimeout(500);
          const body=await page.locator('body').innerText();
          const winErrs=await page.evaluate(()=>window.__errs||[]);
          console.log('BODY', body.slice(0,1500)); console.log('ERRORS',JSON.stringify([...errors,...winErrs]));
          if(!body.includes('CRAFTING')) throw new Error('crafting UI not visible');
          if(errors.length||winErrs.length) throw new Error('browser errors: '+[...errors,...winErrs].join(' | '));
          await browser.close();
          JS
      - name: Run Vite
        run: npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 & echo $! > /tmp/vite.pid
      - run: sleep 2 && node browser-smoke.mjs
