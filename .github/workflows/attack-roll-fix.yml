name: Attack roll display fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN ATTACK ROLL DISPLAY FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patchAttackRollDisplay.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify attack roll display shape
        run: |
          grep -q 'label: `${label} Attack`' src/hooks/useGame.js
          grep -q 'value: total' src/hooks/useGame.js
          grep -q 'dc: diff' src/hooks/useGame.js
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js
          git diff --cached --quiet && exit 0
          git commit -m "Show DM-requested attack rolls in message feed"
          git push origin HEAD:main
