name: Fix API start gate

on:
  push:
    branches: [divine-deity-roll]
    paths:
      - '.github/workflows/fix-api-start-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: divine-deity-roll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_api_start_gate.py
      - run: npm ci
      - run: npm run build
      - name: Verify either-key start gate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text()
          assert "disabled={!apiKey && !openAiApiKey}" in s
          assert "opacity:(apiKey || openAiApiKey)?1:0.4" in s
          assert "Enter an Anthropic or OpenAI API key above to begin" in s
          assert "disabled={!apiKey}" not in s[s.index('BEGIN YOUR LEGEND')-300:s.index('BEGIN YOUR LEGEND')+500]
          print('either-provider start gate verified')
          PY
      - run: rm -f .github/scripts/fix_api_start_gate.py .github/workflows/fix-api-start-gate.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow game start with either API provider' || exit 0
          git push origin HEAD:divine-deity-roll
