name: Trim Grok 4.3 roll rule
on:
  push:
    branches: [grok-provider]
    paths: ['.github/workflows/trim-grok43-roll-rule.yml']
permissions:
  contents: write
jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider
          fetch-depth: 0
      - name: Remove redundant Grok roll instruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/prompts/grok43.js')
          s = p.read_text()
          target = "- NEVER request two rolls back-to-back. After any [ROLL:] request is resolved, narrate the consequence and return control to the player; do not immediately end that resolution with another [ROLL:]. If a sequence could plausibly require several checks, use one meaningful roll to resolve the immediate uncertainty and only ask for another on a later player action if a new, distinct uncertainty actually arises.\n"
          if s.count(target) != 1:
              raise SystemExit(f'Expected exactly one Grok roll rule, found {s.count(target)}')
          p.write_text(s.replace(target, ''))
          PY
          ! grep -q 'NEVER request two rolls back-to-back' src/prompts/grok43.js
          ! grep -q 'DICE FREQUENCY' src/prompts/sharedLow.js
          git diff --check
          npm ci
          npm run build
          git rm .github/workflows/trim-grok43-roll-rule.yml
          git add src/prompts/grok43.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Grok 4.3 roll sequencing rule'
          git push origin grok-provider
