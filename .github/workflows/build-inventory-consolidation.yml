name: Build inventory consolidation
on:
  push:
    branches: [inventory-consolidation]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply consolidation feature
        run: node scripts/buildInventoryConsolidation.mjs
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/Sidebar.jsx src/helpers/openai/consolidate.js
          git diff --cached --quiet && exit 0
          git commit -m "Add inventory consolidation tools"
          git push
