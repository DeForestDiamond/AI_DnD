name: Crafting source filter build
on:
  push:
    branches: [feat/crafting-source-filter]
    paths: ['.github/workflows/source-filter-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crafting-source-filter
      - name: Apply source filter patch
        run: python3 .github/scripts/source_filter_patch.py
      - name: Build app
        run: npm ci && npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.jsx
          git commit -m "Add inventory and stash filters to crafting" || exit 0
          git push origin feat/crafting-source-filter
