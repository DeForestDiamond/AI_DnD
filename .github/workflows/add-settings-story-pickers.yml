name: Add settings story pickers
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch settings story pickers
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---- Sidebar.jsx -----------------------------------------------------
          p = Path('src/components/Sidebar.jsx')
          s = p.read_text()

          old = "import { PACING, ENVIRONMENTS } from '../constants/encounters.js';"
          new = old + "\nimport { fixedArcLocationFor, arcLocationOptionsFor } from '../constants/encounters/arcLocations.js';"
          if "arcLocationOptionsFor" not in s:
              if old not in s: raise SystemExit('Sidebar encounter import missing')
              s = s.replace(old, new, 1)

          old_sig = "onRollArc, onSetArc, adventure, onClearAdventure, onRollAdventure,"
          new_sig = "onRollArc, onSetArc, onSetArcLocation, antagonistOptions=[], adventure, onClearAdventure, onRollAdventure, onSetAdventure, adventureOptions=[],"
          if new_sig not in s:
              if old_sig not in s: raise SystemExit('Sidebar story props signature marker missing')
              s = s.replace(old_sig, new_sig, 1)

          state_marker = "  const [arcCustomText, setArcCustomText] = useState('');"
          state_new = state_marker + "\n  const [storyAntagonistPick, setStoryAntagonistPick] = useState('');\n  const [storyAdventurePick, setStoryAdventurePick] = useState('');"
          if "storyAntagonistPick" not in s:
              if state_marker not in s: raise SystemExit('Sidebar state marker missing')
              s = s.replace(state_marker, state_new, 1)

          adv_marker = "          <div style={{display:'flex',gap:6}}>\n            <button onClick={onRollAdventure}"
          adv_insert = """          <div style={{display:'flex',gap:6,marginBottom:6}}>
            <select value={storyAdventurePick} onChange={e=>setStoryAdventurePick(e.target.value)} style={{flex:1,minWidth:0,background:colors.bgDark,border:`1px solid ${colors.borderDim}`,color:colors.textDim,fontSize:10,padding:'4px 5px',borderRadius:3}}>
              <option value="">Choose Adventure…</option>
              {(adventureOptions||[]).map(a => <option key={a.title} value={a.title}>{a.title}</option>)}
            </select>
            <button disabled={!storyAdventurePick} onClick={()=>{ if(storyAdventurePick){ onSetAdventure?.(storyAdventurePick); setStoryAdventurePick(''); } }} style={{...btn(false),fontSize:10,padding:'4px 7px',opacity:storyAdventurePick?1:0.4}}>Set</button>
          </div>
""" + adv_marker
          if "Choose Adventure…" not in s:
              if adv_marker not in s: raise SystemExit('Adventure UI marker missing')
              s = s.replace(adv_marker, adv_insert, 1)

          arc_open = "      {onClearArc && (\n        <div style={{marginTop:6,padding:'7px 9px',background:'rgba(0,0,0,0.25)',border:`1px solid ${colors.borderDim}`,borderRadius:3}}>"
          arc_controls = arc_open + """
          <div style={{fontSize:10,color:colors.textGhost,letterSpacing:0.5,marginBottom:3}}>ANTAGONIST ARC</div>
          <div style={{display:'flex',gap:6,marginBottom:6}}>
            <select value={storyAntagonistPick} onChange={e=>setStoryAntagonistPick(e.target.value)} style={{flex:1,minWidth:0,background:colors.bgDark,border:`1px solid ${colors.borderDim}`,color:colors.textDim,fontSize:10,padding:'4px 5px',borderRadius:3}}>
              <option value="">Choose Antagonist…</option>
              {(antagonistOptions||[]).map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <button disabled={!storyAntagonistPick} onClick={()=>{ if(storyAntagonistPick){ onSetArc?.(storyAntagonistPick); setStoryAntagonistPick(''); } }} style={{...btn(false),fontSize:10,padding:'4px 7px',opacity:storyAntagonistPick?1:0.4}}>Set</button>
          </div>
          {arcAntagonist && (() => {
            const fixed = fixedArcLocationFor(arcAntagonist);
            const locations = arcLocationOptionsFor(arcAntagonist);
            return <div style={{marginBottom:6}}>
              <div style={{fontSize:9,color:colors.textGhost,marginBottom:3}}>ANTAGONIST LOCATION</div>
              {fixed ? (
                <div style={{fontSize:10,color:colors.textFaint,padding:'4px 5px',border:`1px solid ${colors.borderDim}`,borderRadius:3}}>📍 {fixed} <span style={{color:colors.textDead}}>(fixed)</span></div>
              ) : (
                <select value={arcLocation || ''} onChange={e=>e.target.value && onSetArcLocation?.(e.target.value)} style={{width:'100%',background:colors.bgDark,border:`1px solid ${colors.borderDim}`,color:colors.textDim,fontSize:10,padding:'4px 5px',borderRadius:3}}>
                  <option value="">Choose location…</option>
                  {locations.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                </select>
              )}
            </div>;
          })()}
"""
          if "Choose Antagonist…" not in s:
              if arc_open not in s: raise SystemExit('Arc panel opening marker missing')
              s = s.replace(arc_open, arc_controls, 1)

          p.write_text(s)

          # ---- App.jsx ---------------------------------------------------------
          p = Path('src/App.jsx')
          s = p.read_text()

          sidebar_marker = "            arcLocation={character.arc?.arcLocation || null}\n            adventure={character.adventure || null}"
          sidebar_new = "            arcLocation={character.arc?.arcLocation || null}\n            antagonistOptions={antagonistsForLevel(character.level)}\n            adventureOptions={ADVENTURES}\n            adventure={character.adventure || null}"
          if "antagonistOptions={antagonistsForLevel(character.level)}" not in s:
              if sidebar_marker not in s: raise SystemExit('App Sidebar options marker missing')
              s = s.replace(sidebar_marker, sidebar_new, 1)

          adv_cb_marker = "            onRollAdventure={() => {\n              const adventure = rollSituationAdventure(charRef.current.completedAdventures || []);"
          adv_cb_new = """            onSetAdventure={(title) => {
              const selected = prepareSituationAdventure(title);
              if (!selected) return;
              const { arc, adventure: oldAdventure, ...rest } = charRef.current;
              updateChar({ ...rest, adventure: selected });
              log(`[ADVENTURE] Chosen by player — ${selected.title}`);
            }}
""" + adv_cb_marker
          if "onSetAdventure={(title)" not in s:
              if adv_cb_marker not in s: raise SystemExit('App Adventure callback marker missing')
              s = s.replace(adv_cb_marker, adv_cb_new, 1)

          old_set_arc = "            onSetArc={(text) => {\n              const { adventure, ...rest } = charRef.current;\n              updateChar({ ...rest, arc: makeArc(text) });"
          if old_set_arc not in s:
              raise SystemExit('App onSetArc callback marker missing')

          loc_cb = """            onSetArcLocation={(location) => {
              const c = charRef.current;
              if (!c.arc?.antagonist) return;
              const fixed = fixedArcLocationFor(c.arc.antagonist);
              const nextLocation = fixed || location;
              updateChar({ ...c, arc: { ...c.arc, arcLocation: nextLocation } });
              log(`[ARC] Location chosen by player — ${nextLocation}`);
            }}
"""
          if "onSetArcLocation={(location)" not in s:
              s = s.replace(old_set_arc, loc_cb + old_set_arc, 1)

          import_marker = "import { rollAntagonist, rollArc, makeArc, antagonistsForLevel, encounterChance, rollEncounterDirective, PACING_ORDER } from './constants/encounters.js';"
          import_new = import_marker + "\nimport { fixedArcLocationFor } from './constants/encounters/arcLocations.js';"
          if "import { fixedArcLocationFor } from './constants/encounters/arcLocations.js';" not in s:
              if import_marker not in s: raise SystemExit('App encounter import marker missing')
              s = s.replace(import_marker, import_new, 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit feature and retire workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-settings-story-pickers.yml
          git add src/App.jsx src/components/Sidebar.jsx
          git commit -m "Add story driver pickers to settings"
          git push
