name: Fix magic bonus parsing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch parser
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/constants/items.js')
          s = p.read_text()
          old = "    (parts[3] || '').split(',').forEach(b => {"
          new = "    (parts[3] || '').split(/[\\s,]+/).forEach(b => {"
          if old not in s:
              raise SystemExit('Magic bonus parser anchor not found; refusing to guess')
          if new in s:
              raise SystemExit('Parser already patched')
          s = s.replace(old, new, 1)
          p.write_text(s)
          assert new in s
      - name: Build
        run: npm ci && npm run build
      - name: Commit and clean up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-magic-bonus-parsing.yml
          git add src/constants/items.js
          git commit -m "Accept whitespace-separated magic item bonuses"
          git push
