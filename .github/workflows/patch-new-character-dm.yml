name: Patch new character DM selector
on:
  push:
    branches: [time-distance-grounding]
    paths: ['.github/workflows/patch-new-character-dm.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-distance-grounding
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch adventure start DM selector
        shell: python
        run: |
          from pathlib import Path

          modal = Path('src/components/modals/StartModal.jsx')
          s = modal.read_text()
          old_sig = "export function AdventureStartModal({ onRandom, onSituationAdventure, onChooseAdventure, onManual, onChooseAntagonist, antagonists = [], defeatedAntagonists = [], adventures = [], completedAdventures = [] }) {"
          new_sig = "export function AdventureStartModal({ onRandom, onSituationAdventure, onChooseAdventure, onManual, onChooseAntagonist, selectedModel = 'sonnet', onSelectModel, hasAnthropic = false, hasOpenAI = false, antagonists = [], defeatedAntagonists = [], adventures = [], completedAdventures = [] }) {"
          if s.count(old_sig) != 1:
              raise SystemExit(f'Expected one modal signature, found {s.count(old_sig)}')
          s = s.replace(old_sig, new_sig)

          anchor = "  const visibleAdventures = (adventures || [])\n    .filter(a => showCompletedAdventures || !completedTitles.has(a.title))\n    .filter(a => !adventureSearch.trim() || a.title.toLowerCase().includes(adventureSearch.trim().toLowerCase()));\n"
          insert = anchor + "\n  const dmOptions = [\n    { id:'sonnet', label:'✨ Sonnet', provider:'Anthropic', enabled:hasAnthropic },\n    { id:'haiku', label:'⚡ Haiku', provider:'Anthropic', enabled:hasAnthropic },\n    { id:'gpt', label:'🧠 GPT Sol', provider:'OpenAI', enabled:hasOpenAI },\n    { id:'terra', label:'🌍 GPT Terra', provider:'OpenAI', enabled:hasOpenAI },\n  ];\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one adventure filter anchor, found {s.count(anchor)}')
          s = s.replace(anchor, insert)

          cards = "          <div style={{display:'flex',flexDirection:'column',gap:12}}>\n            <div onClick={onRandom} style={card} onMouseEnter={hoverOn} onMouseLeave={hoverOff}>"
          dm_ui = "          <div style={{display:'flex',flexDirection:'column',gap:12}}>\n            <div style={{background:colors.bgDark,border:`1px solid ${colors.borderDim}`,borderRadius:6,padding:12}}>\n              <div style={{fontFamily:fonts.display,color:colors.gold,fontSize:11,marginBottom:8}}>Choose Dungeon Master</div>\n              <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:8}}>\n                {dmOptions.map(dm => <button key={dm.id} disabled={!dm.enabled} onClick={()=>dm.enabled&&onSelectModel?.(dm.id)} style={{...btn(selectedModel===dm.id),padding:'8px 6px',fontSize:11,opacity:dm.enabled?1:0.35,cursor:dm.enabled?'pointer':'not-allowed'}} title={dm.enabled?dm.provider:`${dm.provider} API key required`}>{dm.label}</button>)}\n              </div>\n              <div style={{fontSize:10,color:colors.textGhost,marginTop:7,lineHeight:1.4}}>Select the DM before the opening request is sent. Models without an available API key are disabled.</div>\n            </div>\n            <div onClick={onRandom} style={card} onMouseEnter={hoverOn} onMouseLeave={hoverOff}>"
          if s.count(cards) != 1:
              raise SystemExit(f'Expected one start-card anchor, found {s.count(cards)}')
          s = s.replace(cards, dm_ui)
          modal.write_text(s)

          app = Path('src/App.jsx')
          a = app.read_text()
          app_anchor = "        <AdventureStartModal\n          antagonists={antagonistsForLevel(adventureStartChar.level)}"
          app_insert = "        <AdventureStartModal\n          selectedModel={selectedModel}\n          onSelectModel={setSelectedModel}\n          hasAnthropic={!!(apiKey || import.meta.env.VITE_ANTHROPIC_KEY)}\n          hasOpenAI={!!(openAiApiKey || import.meta.env.VITE_OPENAI_KEY)}\n          antagonists={antagonistsForLevel(adventureStartChar.level)}"
          if a.count(app_anchor) != 1:
              raise SystemExit(f'Expected one AdventureStartModal render anchor, found {a.count(app_anchor)}')
          a = a.replace(app_anchor, app_insert)
          app.write_text(a)
      - run: npm ci
      - run: npm run build
      - name: Verify selector wiring
        shell: python
        run: |
          from pathlib import Path
          modal = Path('src/components/modals/StartModal.jsx').read_text()
          app = Path('src/App.jsx').read_text()
          for text in ['Choose Dungeon Master', "id:'gpt'", "id:'terra'", 'onSelectModel', 'hasAnthropic', 'hasOpenAI']:
              assert text in modal
          for text in ['selectedModel={selectedModel}', 'onSelectModel={setSelectedModel}', 'VITE_ANTHROPIC_KEY', 'VITE_OPENAI_KEY']:
              assert text in app
      - name: Commit source and remove workflow
        run: |
          rm .github/workflows/patch-new-character-dm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/components/modals/StartModal.jsx .github/workflows/patch-new-character-dm.yml
          git commit -m 'Choose DM before first adventure'
          git push origin HEAD:time-distance-grounding
# trigger-2