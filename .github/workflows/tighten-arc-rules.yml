name: Tighten arc rules
on:
  push:
    branches: [feat/arc-locations]
    paths: [.github/workflows/tighten-arc-rules.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arc-locations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tighten antagonist rules
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/hooks/useGame.js')
          s = p.read_text()
          old = '''KEEP THE THREAD WARM. The player is free to pursue their own jobs and detours — follow them, never railroad. But do not let the antagonist vanish for long stretches: even when the player is off doing something else, surface the antagonist periodically — a fresh rumor, a new sign of its work, an effect rippling into the player's current activity — so the arc stays alive in the background and is ready to re-engage when the player turns back toward it.'''
          new = '''THE ACTIVE ARC IS THE CAMPAIGN'S PRIMARY NARRATIVE THREAD. EVERY SCENE, SIDE QUEST, RANDOM ENCOUNTER, NPC INTERACTION, AND PLAYER-DIRECTED DETOUR MUST EITHER ADVANCE THE ACTIVE ARC DIRECTLY OR CREATE A CONCRETE REASON, CLUE, RESOURCE, CONTACT, CONSEQUENCE, OR OPPORTUNITY THAT MOVES THE STORY TOWARD THE ACTIVE ANTAGONIST AND ARC LOCATION. NEVER PAUSE, REPLACE, FORGET, OR WAIT FOR THE PLAYER TO REINTRODUCE THE ACTIVE ARC. THE PLAYER ALWAYS CHOOSES THEIR ACTIONS; YOU CONTROL HOW THE WORLD RESPONDS, AND THE WORLD MUST KEEP THE ACTIVE ARC MOVING FORWARD.\nIF THE PLAYER IS NOT AT OR MOVING TOWARD THE ARC LOCATION, INTRODUCE AN ORGANIC AND CONCRETE REASON TO MOVE TOWARD IT. DO THIS WITHOUT ASKING THE PLAYER WHETHER THEY WANT TO PURSUE THE ARC. DO NOT TREAT A SIDE QUEST, DETOUR, BUSINESS, PERSONAL GOAL, OR RANDOM EVENT AS AN EXEMPT STORYLINE. IT MUST STILL CONNECT BACK TO THE ACTIVE ANTAGONIST OR MOVE THE PLAYER TOWARD THE ARC LOCATION.'''
          if old not in s:
              raise SystemExit('target arc rule block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - run: npm ci
      - run: npm run build
      - name: Commit prompt update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js
          git commit -m "feat: make active arc progression mandatory"
          git push
