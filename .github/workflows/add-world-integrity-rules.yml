name: Add world integrity rules
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply world integrity patch
        run: python .github/scripts/add_world_integrity_rules.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/prompts/shared.js src/prompts/sol.js src/prompts/terra.js src/prompts/sonnet.js src/prompts/haiku.js
          git commit -m "Add world resistance and observer knowledge rules"
          git push
