name: Split model prompts
on:
  push:
    branches: [grok-provider]
    paths: ['.github/workflows/split-model-prompts.yml']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider
          fetch-depth: 0
      - name: Split shared and Grok prompts
        shell: bash
        run: |
          set -euo pipefail
          cp src/prompts/shared.js src/prompts/sharedLow.js
          cp src/prompts/grok.js src/prompts/grok43.js
          cp src/prompts/grok.js src/prompts/grok46.js

          sed -i "s#from './shared.js'#from './sharedLow.js'#" src/prompts/haiku.js src/prompts/terra.js src/prompts/grok43.js
          sed -i 's/buildSystemPromptGrok =/buildSystemPromptGrok43 =/' src/prompts/grok43.js
          sed -i 's/System Prompt — Grok/System Prompt — Grok 4.3/' src/prompts/grok43.js
          sed -i 's/buildSystemPromptGrok =/buildSystemPromptGrok46 =/' src/prompts/grok46.js
          sed -i 's/System Prompt — Grok/System Prompt — Grok 4.6/' src/prompts/grok46.js
          git rm src/prompts/grok.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/hooks/useGame.js')
          s=p.read_text()
          a="import { buildSystemPromptGrok } from '../prompts/grok.js';"
          b="import { buildSystemPromptGrok43 } from '../prompts/grok43.js';\nimport { buildSystemPromptGrok46 } from '../prompts/grok46.js';"
          assert a in s
          s=s.replace(a,b)
          a='export { buildSystemPromptSonnet, buildSystemPromptSol, buildSystemPromptTerra, buildSystemPromptGrok };'
          b='export { buildSystemPromptSonnet, buildSystemPromptSol, buildSystemPromptTerra, buildSystemPromptGrok43, buildSystemPromptGrok46 };'
          assert a in s
          p.write_text(s.replace(a,b))

          p=Path('src/App.jsx')
          s=p.read_text()
          a='buildSystemPromptTerra, buildSystemPromptGrok, cleanDisplayText'
          b='buildSystemPromptTerra, buildSystemPromptGrok43, buildSystemPromptGrok46, cleanDisplayText'
          assert a in s
          s=s.replace(a,b,1)
          pattern=re.compile(r": \(selectedModel === 'grok' \|\| selectedModel === 'grok46'\)\n\s+\? buildSystemPromptGrok\(([^)\n]+)\)")
          def repl(m):
              arg=m.group(1)
              return ": selectedModel === 'grok'\n        ? buildSystemPromptGrok43("+arg+")\n        : selectedModel === 'grok46'\n        ? buildSystemPromptGrok46("+arg+")"
          s,count=pattern.subn(repl,s)
          assert count == 2, count
          p.write_text(s)
          PY

          ! grep -R "prompts/grok.js\|buildSystemPromptGrok(" -n src --exclude-dir=node_modules
          test "$(grep -c "buildSystemPromptGrok43(" src/App.jsx)" -eq 2
          test "$(grep -c "buildSystemPromptGrok46(" src/App.jsx)" -eq 2
          grep -q "from './sharedLow.js'" src/prompts/haiku.js
          grep -q "from './sharedLow.js'" src/prompts/terra.js
          grep -q "from './sharedLow.js'" src/prompts/grok43.js
          grep -q "from './shared.js'" src/prompts/grok46.js
          git diff --check
          npm ci
          npm run build

          git rm .github/workflows/split-model-prompts.yml
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Split low-end shared and Grok model prompts'
          git push origin grok-provider
