name: Feats
on:
  push:
    paths:
      - 'src/constants/feats.js'
      - 'src/helpers/feats.js'
      - 'src/components/sidebar/FeatsPanel.jsx'
      - 'src/components/sidebar/LevelUpPanel.jsx'
      - 'src/hooks/character/**'
      - 'src/helpers/characterTools.js'
      - 'src/prompts/state.js'
      - 'src/prompts/haiku.js'
      - 'tests/feats*'
      - '.github/workflows/feats.yml'
  pull_request:
    paths:
      - 'src/constants/feats.js'
      - 'src/helpers/feats.js'
      - 'src/components/sidebar/FeatsPanel.jsx'
      - 'src/components/sidebar/LevelUpPanel.jsx'
      - 'src/hooks/character/**'
      - 'src/helpers/characterTools.js'
      - 'src/prompts/state.js'
      - 'src/prompts/haiku.js'
      - 'tests/feats*'
      - '.github/workflows/feats.yml'
permissions:
  contents: read
jobs:
  feats:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/feats.test.mjs tests/characterTools.test.mjs tests/weaponDamage.test.mjs tests/companionEquipment.test.mjs tests/promptConsolidation.test.mjs tests/browserSave.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mobile and desktop feat workflows
        env:
          FEAT_SCREENSHOT_DIR: test-results/feats
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/feat-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/feats.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feat-screenshots
          path: test-results/feats
          if-no-files-found: ignore
