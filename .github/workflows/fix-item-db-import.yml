name: Fix ITEM_DB import
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch import
        run: python .github/scripts/fix_item_db_import.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hooks/character/useCharacter.js
          git commit -m "Fix ITEM_DB import in character creation"
          git push
