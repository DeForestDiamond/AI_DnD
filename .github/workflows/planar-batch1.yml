name: Planar expansion batch 1

on:
  push:
    branches: [astral-encounters]
    paths: ['.github/workflows/planar-batch1.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astral-encounters
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply planar batch 1
        run: python .github/scripts/planar_batch1.py
      - name: Syntax check
        run: node --check src/constants/encounters.js
      - name: Commit batch 1
        run: |
          rm -f .github/scripts/planar_batch1.py .github/workflows/planar-batch1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/constants/encounters.js .github/scripts .github/workflows
          git commit -m 'Add Shadowfell Fire and Water encounter planes'
          git push origin astral-encounters
