name: Fix Terra reasoning effort
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/settings_story_pickers.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx src/components/Sidebar.jsx
          git commit -m "Add story driver pickers to settings"
          git push
