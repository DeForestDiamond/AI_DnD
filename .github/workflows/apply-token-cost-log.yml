name: Apply token cost telemetry
on:
  push:
    branches: [grok-provider]
    paths:
      - 'scripts/patchTokenCostLog.mjs'
      - '.github/workflows/apply-token-cost-log.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/patchTokenCostLog.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit patch and remove temporary patcher
        run: |
          rm scripts/patchTokenCostLog.mjs .github/workflows/apply-token-cost-log.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add persistent token and cost log"
          git push
