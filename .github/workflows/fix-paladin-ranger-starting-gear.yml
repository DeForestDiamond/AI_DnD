name: Fix Paladin and Ranger starting gear
'on':
  push:
    branches: [main]
    paths: [.github/workflows/fix-paladin-ranger-starting-gear.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing starting gear
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/constants/classes.js')
          s=p.read_text()
          anchor="  Sorcerer:     { slots:{ ...EMPTY_SLOTS, mainhand:'Dagger' },                                             inventory:['Arcane Focus','Component Pouch','Torch','Rations','Rations','Rations'] },"
          insert="  Paladin:      { slots:{ ...EMPTY_SLOTS, mainhand:'Longsword', offhand:'Shield', armor:'Chain Mail' },     inventory:['Holy Symbol','Javelin','Javelin','Javelin','Javelin','Javelin','Torch','Rations','Rations','Rations'] },\n  Ranger:       { slots:{ ...EMPTY_SLOTS, mainhand:'Longbow', armor:'Studded Leather' },                      inventory:['Shortsword','Shortsword','Hunter\\'s Kit','Torch','Rations','Rations','Rations'] },\n"
          if '  Paladin:      { slots:{ ...EMPTY_SLOTS' in s or '  Ranger:       { slots:{ ...EMPTY_SLOTS' in s:
              raise SystemExit('Paladin or Ranger starting gear already exists')
          if anchor not in s: raise SystemExit('anchor missing')
          s=s.replace(anchor, insert+anchor,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/constants/classes.js
          git commit -m "fix: add Paladin and Ranger starting gear"
          git push
