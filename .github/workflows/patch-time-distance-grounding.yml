name: Patch time and distance grounding
on:
  push:
    branches: [time-distance-grounding]
    paths: ['.github/workflows/patch-time-distance-grounding.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: time-distance-grounding
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch prompt
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/hooks/useGame.js')
          s = p.read_text()
          old = '''── TIME & DISTANCE — LET THE WORLD MOVE NATURALLY ──
          Keep an approximate sense of elapsed time and travel progress. When the player's actions reasonably take minutes or hours, allow the clock to advance naturally; do not freeze an entire sequence of activity at the same time of day. Likewise, when the player is actively travelling toward a destination, each meaningful stretch of travel should make believable progress toward it and ordinary uninterrupted travel may eventually arrive.
          Be gentle with this: do NOT fast-forward through scenes the player is actively participating in, skip decisions, invent delays just to consume time, or rush travel to force arrival. Exact times, distances, and speeds are unnecessary unless already established or relevant. Use common-sense narrative scale, preserve player control, and let elapsed time or distance advance only as much as the player's actions reasonably imply.'''.replace('          ', '')
          new = '''── TIME & DISTANCE — THE WORLD MUST MOVE ──
          TIME AND DISTANCE MUST ADVANCE. Every meaningful action consumes believable time. Conversations take minutes. Shopping and preparation take time. Hunting, exploration, combat and its aftermath, recovery, crafting, meals, rest, and travel consume substantial time. Do not keep the world at the same hour across multiple scenes unless those scenes truly occur back-to-back within that hour. A sequence of events requires a sequence of time: if the player has fought twelve separate encounters while guarding a caravan, hours or days have passed unless an explicit supernatural effect says otherwise. It must not still be the same morning.

          GROUND SCENES IN TIME. When establishing a new scene or transitioning between scenes, naturally mention the approximate time of day when relevant — dawn, morning, midday, afternoon, dusk, evening, night, or after midnight. This is continuity, not decorative prose: treat previously established temporal descriptions as facts and advance from them. Never silently reset to an earlier time of day. You do not need to state a clock time every response, but regularly re-ground long sequences, travel, downtime, and activities that consume meaningful time so the passage of time remains visible in the narrative.

          TRAVEL MAKES REAL PROGRESS. When the player is travelling toward a destination, the destination MUST get closer as scenes pass. Ordinary overland travel covers believable distance each day. Encounters interrupt travel; they do not erase the miles already travelled before or after them. If a distance, duration, departure time, or expected arrival has already been established, preserve it as a continuity fact and reason forward from it. Do not leave a caravan, ship, mount, or walking party effectively stationary merely because several encounters are being played out in detail.

          Do not wait for the player to explicitly say “time passes,” “we travel another day,” or “we go another twenty miles.” Advance time and distance as natural consequences of what actually happens. Preserve player agency over decisions, destinations, routes, stops, and actions; the existence of elapsed time is not a player decision and advancing the clock is not railroading.

          Do NOT fast-forward through an unresolved scene the player is actively participating in, skip decisions, invent delays merely to consume time, or rush travel solely to force arrival. The goal is continuity: actions take the time they plausibly take, travel covers the distance it plausibly covers, and the narration keeps enough temporal grounding that the next scene knows when it is.'''.replace('          ', '')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one time block, found {s.count(old)}; refusing edit')
          s = s.replace(old, new)
          p.write_text(s)
      - run: npm ci
      - run: npm run build
      - name: Verify rules
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/hooks/useGame.js').read_text()
          required = ['TIME AND DISTANCE MUST ADVANCE', 'GROUND SCENES IN TIME', 'TRAVEL MAKES REAL PROGRESS', 'advancing the clock is not railroading', 'twelve separate encounters']
          assert all(x in s for x in required)
          assert 'Keep an approximate sense of elapsed time and travel progress.' not in s
      - name: Commit source and remove workflow
        run: |
          rm .github/workflows/patch-time-distance-grounding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks/useGame.js .github/workflows/patch-time-distance-grounding.yml
          git commit -m 'Ground scenes in advancing time and distance'
          git push origin HEAD:time-distance-grounding