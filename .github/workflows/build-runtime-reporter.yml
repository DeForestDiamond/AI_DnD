name: Verify runtime reporter build
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [src/main.jsx, .github/workflows/build-runtime-reporter.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
