name: Add divine deity roller
on:
  push:
    branches: [divine-deity-roll]
    paths:
      - '.github/scripts/add_divine_deity_roll.py'
      - '.github/workflows/add-divine-deity-roll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: divine-deity-roll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/add_divine_deity_roll.py
      - run: node --check src/constants/adventures.js
      - name: Smoke test divine rolls
        run: |
          node --input-type=module <<'NODE'
          import { prepareSituationAdventure } from './src/constants/adventures.js';
          const counts = { greater:0, intermediate:0, lesser:0 };
          const names = new Set();
          for (let i = 0; i < 5000; i++) {
            const a = prepareSituationAdventure('The Avatar Made You Jump');
            if (!a?.deity?.rank || !a.premise.includes(a.deity.name)) throw new Error('divine deity not embedded in prepared adventure');
            counts[a.deity.rank]++;
            names.add(a.deity.name);
          }
          const two = prepareSituationAdventure('Two Gods, One Problem');
          if (two.deities?.length !== 2 || two.deities[0].name === two.deities[1].name) throw new Error('two-god adventure did not roll two distinct gods');
          if (counts.greater < 1700 || counts.intermediate < 1450 || counts.lesser < 950) throw new Error(`distribution unexpectedly skewed: ${JSON.stringify(counts)}`);
          if (names.size < 25) throw new Error(`deity variety too low: ${names.size}`);
          console.log({ counts, uniqueDeities: names.size, twoGods: two.deities.map(d => d.name) });
          NODE
      - run: rm -f .github/scripts/add_divine_deity_roll.py .github/workflows/add-divine-deity-roll.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Roll divine adventure deities in app' || exit 0
          git push origin HEAD:divine-deity-roll
