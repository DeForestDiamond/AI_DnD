name: Enable prompt log
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-prompt-log.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable prompt logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = 'const PROMPT_LOG_ENABLED = false;'
          new = 'const PROMPT_LOG_ENABLED = true;'
          if old not in s:
              raise SystemExit('PROMPT_LOG_ENABLED=false not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Enable prompt logging" || exit 0
          git push
