name: Unified attack issue trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN UNIFIED ATTACK ROLL PATCH 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patchUnifiedAttackRoll.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify one attack engine
        run: |
          grep -q 'const result = performAttack(attackWeapon, char.stats, char.level);' src/hooks/useGame.js
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify attack roll calculation paths"
          git push origin HEAD:main
