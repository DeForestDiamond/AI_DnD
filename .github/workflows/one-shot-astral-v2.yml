# trigger 2
name: One-shot Astral patch v2

on:
  push:
    branches: [astral-encounters]
    paths: ['.github/workflows/one-shot-astral-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astral-encounters
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_astral.py
      - name: Syntax check
        run: node --check src/constants/encounters.js
      - name: Commit result
        run: |
          rm -f .github/workflows/one-shot-astral-v2.yml
          rm -f .github/workflows/one-shot-astral-encounters.yml
          rm -f .github/scripts/patch_astral.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/constants/encounters.js .github/workflows .github/scripts
          git commit -m 'Add Astral Sea encounter environment'
          git push origin astral-encounters
