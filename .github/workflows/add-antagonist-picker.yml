name: Add antagonist picker
'on':
  push:
    branches: [main]
    paths: [.github/workflows/add-antagonist-picker.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch antagonist picker
        shell: python
        run: |
          from pathlib import Path

          # encounters.js — expose the same level-gated pool the random roller uses.
          p = Path('src/constants/encounters.js')
          s = p.read_text()
          old = "export const rollAntagonist = (level, exclude = null, defeated = []) => {\n  let pool = [...LOW_ANTAGONISTS];\n  if (level >= 5) pool.push(...MID_ANTAGONISTS, ...NAMED_MID);\n  if (level >= 9) pool.push(...HIGH_ANTAGONISTS, ...NAMED_HIGH);"
          new = "export const antagonistsForLevel = (level) => {\n  const pool = [...LOW_ANTAGONISTS];\n  if (level >= 5) pool.push(...MID_ANTAGONISTS, ...NAMED_MID);\n  if (level >= 9) pool.push(...HIGH_ANTAGONISTS, ...NAMED_HIGH);\n  return pool;\n};\n\nexport const rollAntagonist = (level, exclude = null, defeated = []) => {\n  let pool = antagonistsForLevel(level);"
          if old not in s:
              raise SystemExit('encounters anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # App.jsx — import helper, let chosen foe override random seed antagonist,
          # and wire the modal to start a random opening around the selected foe.
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace(
              "import { rollAntagonist, rollArc, makeArc, encounterChance, rollEncounterDirective, PACING_ORDER } from './constants/encounters.js';",
              "import { rollAntagonist, rollArc, makeArc, antagonistsForLevel, encounterChance, rollEncounterDirective, PACING_ORDER } from './constants/encounters.js';",
              1
          )
          old = "        const seed = rollAdventureSeed(char.level);\n        arcAntagonist = seed.antagonist;"
          new = "        const seed = rollAdventureSeed(char.level);\n        arcAntagonist = antagonistOverride?.trim() || seed.antagonist;"
          if old not in s:
              raise SystemExit('random start antagonist anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("ANTAGONIST (do NOT reveal or name yet — plant subtle setup only): ${seed.antagonist}", "ANTAGONIST (do NOT reveal or name yet — plant subtle setup only): ${arcAntagonist}", 1)
          old = "        <AdventureStartModal\n          onRandom={() => { const c = adventureStartChar; setAdventureStartChar(null); startAdventure(c); }}\n          onManual={(text, antagonist) => { const c = adventureStartChar; setAdventureStartChar(null); startAdventure(c, text, antagonist); }}\n        />"
          new = "        <AdventureStartModal\n          antagonists={antagonistsForLevel(adventureStartChar.level)}\n          defeatedAntagonists={adventureStartChar.defeatedAntagonists || []}\n          onRandom={() => { const c = adventureStartChar; setAdventureStartChar(null); startAdventure(c); }}\n          onManual={(text, antagonist) => { const c = adventureStartChar; setAdventureStartChar(null); startAdventure(c, text, antagonist); }}\n          onChooseAntagonist={(antagonist) => { const c = adventureStartChar; setAdventureStartChar(null); startAdventure(c, null, antagonist); }}\n        />"
          if old not in s:
              raise SystemExit('modal wiring anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # StartModal.jsx — replace with picker-capable modal.
          p = Path('src/components/modals/StartModal.jsx')
          p.write_text(r'''import { useState } from 'react';
          import { colors, fonts, btn } from '../../styles/theme.js';

          // Shown when a fresh adventure begins (new game or loading a character with no
          // saved history). Lets the player roll a random opening, write their own, or
          // choose an antagonist and let the app generate the opening around that foe.
          export function AdventureStartModal({ onRandom, onManual, onChooseAntagonist, antagonists = [], defeatedAntagonists = [] }) {
            const [mode, setMode] = useState(null); // null = choosing | 'manual' | 'antagonist'
            const [text, setText] = useState('');
            const [antagonist, setAntagonist] = useState('');
            const [search, setSearch] = useState('');
            const [showDefeated, setShowDefeated] = useState(false);

            const defeated = new Set((defeatedAntagonists || []).map(x => String(x).toLowerCase()));
            const visibleAntagonists = antagonists
              .filter(a => showDefeated || !defeated.has(a.toLowerCase()))
              .filter(a => !search.trim() || a.toLowerCase().includes(search.trim().toLowerCase()));

            const card = {
              background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 6,
              padding: 16, cursor: 'pointer', transition: 'all 0.15s', textAlign: 'left',
            };
            const hoverOn = e => { e.currentTarget.style.borderColor=colors.gold; e.currentTarget.style.background=colors.bgDark; };
            const hoverOff = e => { e.currentTarget.style.borderColor=colors.border; e.currentTarget.style.background=colors.bg; };

            return (
              <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.9)',zIndex:210,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
                <div style={{background:colors.bgPanel,border:`1px solid ${colors.border}`,borderRadius:4,padding:24,maxWidth:640,width:'100%',maxHeight:'90vh',overflow:'auto'}}>
                  <div style={{fontFamily:fonts.display,color:colors.gold,fontSize:16,marginBottom:16,textAlign:'center'}}>🎲 How should this adventure begin?</div>

                  {mode === null ? (
                    <div style={{display:'flex',flexDirection:'column',gap:12}}>
                      <div onClick={onRandom} style={card} onMouseEnter={hoverOn} onMouseLeave={hoverOff}>
                        <div style={{fontSize:28,marginBottom:6}}>🎲</div>
                        <div style={{fontFamily:fonts.display,color:colors.gold,fontSize:13,marginBottom:4}}>Random Start</div>
                        <div style={{fontSize:11,color:colors.textFaint,lineHeight:1.5}}>Roll a fresh setting, scene, hook, and antagonist scaled to your level.</div>
                      </div>
                      <div onClick={()=>setMode('antagonist')} style={card} onMouseEnter={hoverOn} onMouseLeave={hoverOff}>
                        <div style={{fontSize:28,marginBottom:6}}>👑</div>
                        <div style={{fontFamily:fonts.display,color:colors.gold,fontSize:13,marginBottom:4}}>Choose Antagonist</div>
                        <div style={{fontSize:11,color:colors.textFaint,lineHeight:1.5}}>Pick the arc foe yourself, then roll a fresh opening built around them.</div>
                      </div>
                      <div onClick={()=>setMode('manual')} style={card} onMouseEnter={hoverOn} onMouseLeave={hoverOff}>
                        <div style={{fontSize:28,marginBottom:6}}>✍️</div>
                        <div style={{fontFamily:fonts.display,color:colors.gold,fontSize:13,marginBottom:4}}>Write My Own Opening</div>
                        <div style={{fontSize:11,color:colors.textFaint,lineHeight:1.5}}>Describe where and how the story starts — pick up where you left off, or begin at a home base.</div>
                      </div>
                    </div>
                  ) : mode === 'manual' ? (
                    <div>
                      <div style={{fontSize:12,color:colors.textGhost,marginBottom:8,lineHeight:1.5}}>Describe the opening. The DM will start exactly here instead of rolling a random scene.</div>
                      <textarea value={text} onChange={e=>setText(e.target.value)} autoFocus
                        placeholder={'e.g. I arrive back in Saltmere, my home city, after weeks on the road. It is market day, the docks are busy, and I am headed to my usual tavern when...'}
                        rows={6}
                        style={{width:'100%',background:'rgba(0,0,0,0.4)',border:`1px solid ${colors.borderDim}`,borderRadius:3,color:colors.textDim,fontSize:13,fontFamily:'inherit',padding:'8px 10px',resize:'vertical',boxSizing:'border-box',marginBottom:12}}
                      />
                      <div style={{fontSize:12,color:colors.textGhost,marginBottom:6,lineHeight:1.5}}>Arc antagonist <span style={{color:colors.textFaint}}>(optional — leave blank to roll one)</span></div>
                      <input value={antagonist} onChange={e=>setAntagonist(e.target.value)} placeholder={'e.g. a smuggling ring run out of the Saltmere docks'}
                        style={{width:'100%',background:'rgba(0,0,0,0.4)',border:`1px solid ${colors.borderDim}`,borderRadius:3,color:colors.textDim,fontSize:13,fontFamily:'inherit',padding:'8px 10px',boxSizing:'border-box',marginBottom:12}}
                      />
                      <div style={{display:'flex',gap:10}}>
                        <button style={{...btn(false),flex:'0 0 auto'}} onClick={()=>setMode(null)}>← Back</button>
                        <button style={{...btn(true),flex:1,opacity:text.trim()?1:0.4}} disabled={!text.trim()} onClick={()=>text.trim()&&onManual(text.trim(), antagonist.trim() || null)}>Begin Here →</button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div style={{fontSize:12,color:colors.textGhost,marginBottom:10,lineHeight:1.5}}>Choose the hidden antagonist for this arc. The app will roll the opening normally and build toward this foe.</div>
                      <input value={search} onChange={e=>setSearch(e.target.value)} autoFocus placeholder="Search antagonists..."
                        style={{width:'100%',background:'rgba(0,0,0,0.4)',border:`1px solid ${colors.borderDim}`,borderRadius:3,color:colors.textDim,fontSize:13,fontFamily:'inherit',padding:'8px 10px',boxSizing:'border-box',marginBottom:10}}
                      />
                      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:colors.textFaint,marginBottom:10,cursor:'pointer'}}>
                        <input type="checkbox" checked={showDefeated} onChange={e=>setShowDefeated(e.target.checked)} />
                        Show defeated foes ({defeatedAntagonists.length})
                      </label>
                      <div style={{border:`1px solid ${colors.borderDim}`,borderRadius:4,maxHeight:'52vh',overflowY:'auto',marginBottom:12}}>
                        {visibleAntagonists.length ? visibleAntagonists.map(a => {
                          const wasDefeated = defeated.has(a.toLowerCase());
                          return (
                            <div key={a} onClick={()=>onChooseAntagonist(a)}
                              style={{padding:'10px 12px',borderBottom:`1px solid ${colors.borderFaint}`,cursor:'pointer',fontSize:12,lineHeight:1.4,color:wasDefeated?colors.textGhost:colors.textDim,opacity:wasDefeated?0.65:1}}
                              onMouseEnter={e=>e.currentTarget.style.background=colors.bgDark}
                              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                              {wasDefeated && <span style={{marginRight:6}}>☠</span>}{a}
                              {wasDefeated && <span style={{fontSize:9,marginLeft:8,color:colors.textGhost}}>DEFEATED</span>}
                            </div>
                          );
                        }) : (
                          <div style={{padding:18,textAlign:'center',fontSize:11,color:colors.textGhost}}>No antagonists match this filter.</div>
                        )}
                      </div>
                      <button style={{...btn(false),width:'100%'}} onClick={()=>setMode(null)}>← Back</button>
                    </div>
                  )}
                </div>
              </div>
            );
          }
          '''.replace(/^          /gm, ''))
      - run: npm ci
      - run: npm run build
      - name: Commit feature
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/constants/encounters.js src/App.jsx src/components/modals/StartModal.jsx
          git commit -m "feat: add antagonist picker to campaign start"
          git push
