name: Harden stacked items
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/harden-stacked-items.yml, scripts/harden_stacked_items.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/harden_stacked_items.py
      - run: npm ci
      - run: npm run build
      - name: Stack helper smoke test
        run: |
          node --input-type=module <<'NODE'
          import { normalizeStacks, addStack, takeStack, stackCount } from './src/utils/itemStacks.js';
          let x = normalizeStacks({'Iron Ingot':300000,'Mithral Plate':12});
          if (x.length !== 2 || stackCount(x,'Iron Ingot') !== 300000) throw new Error('compressed migration expansion regression');
          x = addStack(x,'Iron Ingot',50);
          if (stackCount(x,'Iron Ingot') !== 300050) throw new Error('addStack failed');
          const t = takeStack(x,'Iron Ingot',299999);
          if (t.removed !== 299999 || stackCount(t.stacks,'Iron Ingot') !== 51) throw new Error('takeStack failed');
          console.log('stack helpers: OK');
          NODE
      - name: Migration smoke test
        run: |
          node --input-type=module <<'NODE'
          import { migrateCharacter } from './src/hooks/useCharacter.js';
          const old = {
            _v:18, name:'Test', stats:{str:10,dex:10,con:10,int:10,wis:10,cha:10}, level:10, xp:0,
            maxHp:10,hp:10,cls:{name:'Artificer'},classLevels:{Artificer:10},slots:{mainhand:'Arcane Pistol'},
            inventory:{'Iron Ingot':300000,'Custom Blade':2},stash:{'Mithral Plate':12000},
            customItems:{'Custom Blade':{type:'weapon',damage:'2d8',label:'test blade'}},
            stashedCustomItems:{}, companions:{Buddy:{slots:{mainhand:'Custom Blade'}}}, npcs:{},towns:{},abilities:{cantrips:[],spells:[],infusions:[],martial:[]},coins:0
          };
          const {char} = migrateCharacter(old);
          if (char.inventory.length !== 2) throw new Error(`inventory expanded: ${char.inventory.length}`);
          if (char.inventory.find(x=>x.name==='Iron Ingot')?.qty !== 300000) throw new Error('iron qty lost');
          if (char.items['Custom Blade']?.damage !== '2d8') throw new Error('custom definition lost');
          if (!char.items['Arcane Pistol']?.damage) throw new Error('equipped built-in definition not injected');
          if ('customItems' in char || 'stashedCustomItems' in char) throw new Error('legacy stores survived');
          console.log('v18 -> v19 migration: OK');
          NODE
      - name: Audit dangerous expansions and legacy runtime refs
        run: |
          grep -RInE "flatMap.*Array\(|new Array\(.*\)\.fill|\.repeat\(batch\)|inventory\.(indexOf|includes|filter|some)|stash\.(indexOf|includes|filter|some)" src && exit 1 || true
          # Legacy names are allowed only in old-version migration code/comments.
          grep -RInE "customItems|stashedCustomItems" src/App.jsx src/components src/hooks/useGame.js && exit 1 || true
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src
          git commit -m "fix: harden stacked items for huge quantities and old saves"
          git push
