name: Planar expansion batch 2

on:
  push:
    branches: [astral-encounters]
    paths: ['.github/workflows/planar-batch2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astral-encounters
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/planar_batch2.py
      - run: node --check src/constants/encounters.js
      - name: Commit batch
        run: |
          rm -f .github/scripts/planar_batch2.py .github/workflows/planar-batch2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/constants/encounters.js .github/scripts .github/workflows
          git commit -m 'Add Air Earth and Limbo encounter planes'
          git push origin astral-encounters
