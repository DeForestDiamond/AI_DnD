name: GPT provider integration builder

on:
  push:
    branches:
      - feat/gpt-provider
    paths:
      - .github/workflows/gpt-provider-build.yml
      - .github/scripts/gpt_provider_patch.py

permissions:
  contents: write

jobs:
  build-gpt-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/gpt-provider
          fetch-depth: 0

      - name: Apply GPT provider patch
        run: python3 .github/scripts/gpt_provider_patch.py

      - name: Build app
        run: npm ci && npm run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js src/App.jsx src/components/Sidebar.jsx src/components/InputBar.jsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Add OpenAI GPT DM provider"
          git push origin feat/gpt-provider
