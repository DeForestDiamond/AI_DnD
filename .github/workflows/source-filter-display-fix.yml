name: Source filter display fix
on:
  push:
    branches: [feat/crafting-source-filter]
    paths: ['.github/workflows/source-filter-display-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crafting-source-filter
      - name: Clamp displayed selection to current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.jsx')
          s=p.read_text()
          # Two panels use the same row pattern. Replace both occurrences.
          s=s.replace('const on = selected[nm] !== undefined;', 'const on = liveSelected[nm] !== undefined;')
          s=s.replace('value={draft[nm] ?? selected[nm]}', 'value={draft[nm] ?? liveSelected[nm]}')
          p.write_text(s)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.jsx
          git commit -m "Clamp source-filtered selection display" || exit 0
          git push origin feat/crafting-source-filter
