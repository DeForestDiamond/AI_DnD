name: Expand planar antagonists on main
on:
  push:
    branches: [main]
    paths: [.github/workflows/expand-planar-main.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch encounters
        run: python3 .github/scripts/expand_planar.py
      - run: npm ci
      - run: npm run build
      - name: Commit expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants/encounters.js
          git commit -m "feat: greatly expand planar arc antagonists"
          git push origin main
