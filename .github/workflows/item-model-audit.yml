name: Item model audit
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/item-model-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory model references
        run: |
          echo '=== custom item / inventory / stash / tag references ==='
          grep -RInE "customItems|stashedCustomItems|inventory|stash|\\[UPDATE:|UPDATE:|\\[ITEM:|ITEM:|\\[REMOVE:|REMOVE:" src --exclude-dir=node_modules || true
          echo '=== starting gear ==='
          grep -RIn "STARTING_GEAR" src || true
          echo '=== item parser ==='
          grep -RInE "parseDMItem|applyEffects|itemExistsAnywhere|equippableInSlot|stackInventory" src || true
