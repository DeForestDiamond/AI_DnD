name: Apply adventure seed helper refactor

on:
  push:
    branches: [gpt-prompt-split]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move adventure seed wiring out of App
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/App.jsx';
          let s = fs.readFileSync(path, 'utf8');

          const importLine = "import { rollAdventureSeed } from './helpers/adventure/seed.js';\n";
          if (!s.includes(importLine)) {
            const anchor = "import { ADVENTURES, rollSituationAdventure, prepareSituationAdventure } from './constants/adventures.js';\n";
            if (!s.includes(anchor)) throw new Error('Adventure import anchor not found');
            s = s.replace(anchor, anchor + importLine);
          }

          const startMarker = '  // ── Adventure RNG seed';
          const endMarker = '  // ── API call';
          const start = s.indexOf(startMarker);
          const end = s.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Adventure RNG seed block not found');
          s = s.slice(0, start) + s.slice(end);

          fs.writeFileSync(path, s);
          NODE
      - name: Remove migration workflow
        run: rm .github/workflows/apply-adventure-seed-helper.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Move adventure RNG seed out of App"
          git push origin HEAD:gpt-prompt-split
