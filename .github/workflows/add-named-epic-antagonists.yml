name: Add epic named antagonists
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch antagonist pools
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/constants/encounters.js')
          s = p.read_text()

          high_end = "  'Tiamat\\'s faithful, working to bring the Dragon Queen through',\n];"
          epic_lines = [
              "const NAMED_EPIC = [ // level 10 only — equivalent to D&D level 20",
              "  'Vlaakith CLVII, lich-queen of the githyanki and ruler of Tu’narath',",
              "  'Orcus, Demon Prince of Undeath, wielder of the Wand of Orcus',",
              "  'Demogorgon, Prince of Demons, the two-headed terror of the Abyss',",
              "  'Graz’zt, the Dark Prince, schemer and ruler of Azzagrat',",
              "  'Juiblex, the Faceless Lord, Demon Prince of Slimes and Oozes',",
              "  'Mephistopheles, Archduke of Cania and master of hellfire',",
              "  'Asmodeus, Lord of the Nine Hells',",
              "  'Vecna, lich-god of secrets and forbidden knowledge',",
              "  'Gromph Baenre, archmage of Menzoberranzan',",
              "  'Arkhan the Cruel, dragonborn champion of Tiamat bearing the Hand of Vecna',",
              "];",
          ]
          if high_end not in s:
              raise SystemExit('NAMED_HIGH end anchor not found; refusing to guess')
          if 'const NAMED_EPIC' in s:
              raise SystemExit('NAMED_EPIC already exists')
          s = s.replace(high_end, high_end + '\n' + '\n'.join(epic_lines), 1)

          fixed_anchor = "  ['Zariel, Archduchess of Avernus, and her Blood War legions','Avernus'],\n"
          fixed_lines = [
              "  ['Vlaakith CLVII, lich-queen of the githyanki and ruler of Tu’narath','Astral Plane'],",
              "  ['Orcus, Demon Prince of Undeath, wielder of the Wand of Orcus','Abyss'],",
              "  ['Demogorgon, Prince of Demons, the two-headed terror of the Abyss','Abyss'],",
              "  ['Graz’zt, the Dark Prince, schemer and ruler of Azzagrat','Abyss'],",
              "  ['Juiblex, the Faceless Lord, Demon Prince of Slimes and Oozes','Abyss'],",
              "  ['Mephistopheles, Archduke of Cania and master of hellfire','Cania, the Eighth Hell'],",
              "  ['Asmodeus, Lord of the Nine Hells','Nessus, the Ninth Hell'],",
              "  ['Gromph Baenre, archmage of Menzoberranzan','Menzoberranzan'],",
              "  ['Arkhan the Cruel, dragonborn champion of Tiamat bearing the Hand of Vecna','Avernus'],",
          ]
          if fixed_anchor not in s:
              raise SystemExit('Fixed-location anchor not found; refusing to guess')
          s = s.replace(fixed_anchor, fixed_anchor + '\n'.join(fixed_lines) + '\n', 1)

          level_anchor = "  if (level >= 9) pool.push(...HIGH_ANTAGONISTS, ...NAMED_HIGH);\n  return pool;"
          if level_anchor not in s:
              raise SystemExit('Level-pool anchor not found; refusing to guess')
          s = s.replace(level_anchor, "  if (level >= 9) pool.push(...HIGH_ANTAGONISTS, ...NAMED_HIGH);\n  if (level >= 10) pool.push(...NAMED_EPIC);\n  return pool;", 1)

          export_anchor = 'export const NAMED_ANTAGONISTS = [...NAMED_MID, ...NAMED_HIGH];'
          if export_anchor not in s:
              raise SystemExit('Named export anchor not found; refusing to guess')
          s = s.replace(export_anchor, 'export const NAMED_ANTAGONISTS = [...NAMED_MID, ...NAMED_HIGH, ...NAMED_EPIC];', 1)

          p.write_text(s)
          for required in ['Vlaakith CLVII','Orcus, Demon Prince','Demogorgon, Prince','Graz’zt','Juiblex','Mephistopheles','Asmodeus','Vecna, lich-god','Gromph Baenre','Arkhan the Cruel']:
              assert required in s, required
          assert 'if (level >= 10) pool.push(...NAMED_EPIC);' in s
          assert '...NAMED_HIGH, ...NAMED_EPIC' in s
      - name: Build
        run: npm ci && npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-named-epic-antagonists.yml
          git add src/constants/encounters.js
          git commit -m "Add epic named antagonist pool"
          git push
