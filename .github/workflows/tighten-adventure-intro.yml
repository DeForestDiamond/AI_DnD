name: Tighten adventure intro prompt
'on':
  push:
    branches: [main]
    paths: [.github/workflows/tighten-adventure-intro.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .github/scripts/tighten_intro.py
      - run: npm ci
      - run: npm run build
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: preserve player agency in adventure intros"
          git push origin main
