name: Add crafting error boundary
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/add-crafting-error-boundary.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.jsx')
          s=p.read_text()
          s=s.replace("import { useState } from 'react';", "import { useState, Component } from 'react';", 1)
          anchor='''function CollapsibleSection({ title, count, defaultOpen = false, children }) {\n'''
          boundary='''class PanelErrorBoundary extends Component {\n  constructor(props) { super(props); this.state = { error:null }; }\n  static getDerivedStateFromError(error) { return { error }; }\n  componentDidCatch(error, info) { console.error('Sidebar panel render failed:', error, info); }\n  render() {\n    if (!this.state.error) return this.props.children;\n    return (\n      <div style={{border:`1px solid ${colors.redFaint||'#8a3a3a'}`,borderRadius:4,padding:8,color:'#c96a4c',fontSize:11,lineHeight:1.45}}>\n        <div style={{fontFamily:fonts.display,fontSize:12,marginBottom:4}}>CRAFTING PANEL ERROR</div>\n        <div style={{fontFamily:fonts.mono,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{String(this.state.error?.message || this.state.error)}</div>\n        <div style={{color:colors.textGhost,marginTop:5}}>The rest of the game is still safe. Copy this error and send it back for the exact failing data path.</div>\n      </div>\n    );\n  }\n}\n\nfunction CollapsibleSection({ title, count, defaultOpen = false, children }) {\n'''
          if 'class PanelErrorBoundary' not in s:
              if anchor not in s: raise SystemExit('collapsible anchor missing')
              s=s.replace(anchor,boundary,1)
          old="""      {activeTab==='crafting' && <>\n      {/* Crafting — turn materials into gear */}\n      {onProposeCrafting && (\n        <CraftingPanel character={character} db={db} onProposeCrafting={onProposeCrafting} onExecuteCrafting={onExecuteCrafting} />\n      )}\n\n      {/* Salvage — break items back into materials */}\n      {onProposeDismantle && (\n        <SalvagePanel character={character} db={db} onProposeDismantle={onProposeDismantle} onExecuteDismantle={onExecuteDismantle} />\n      )}\n      </>}\n"""
          new="""      {activeTab==='crafting' && <PanelErrorBoundary>\n      {/* Crafting — turn materials into gear */}\n      {onProposeCrafting && (\n        <CraftingPanel character={character} db={db} onProposeCrafting={onProposeCrafting} onExecuteCrafting={onExecuteCrafting} />\n      )}\n\n      {/* Salvage — break items back into materials */}\n      {onProposeDismantle && (\n        <SalvagePanel character={character} db={db} onProposeDismantle={onProposeDismantle} onExecuteDismantle={onExecuteDismantle} />\n      )}\n      </PanelErrorBoundary>}\n"""
          if old not in s: raise SystemExit('crafting tab anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/Sidebar.jsx
          git commit -m "fix: contain and expose crafting panel render errors"
          git push
