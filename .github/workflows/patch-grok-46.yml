name: Patch Grok 4.6 option

on:
  push:
    branches: [grok-provider]
    paths:
      - '.github/workflows/patch-grok-46.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider

      - name: Add Grok 4.6 alongside Grok 4.3
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old!r}')
              if found == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              p.write_text(text.replace(old, new))

          # Model config: keep 4.3 and add 4.6 as a separate xAI DM option.
          replace(
              'src/hooks/useGame.js',
              "  grok: {\n    provider: 'xai',\n    model: 'grok-4.3',\n    max_tokens: 2048,\n    reasoning_effort: 'low',\n    label: 'Grok 4.3',\n    emoji: '🚀',\n  },\n",
              "  grok: {\n    provider: 'xai',\n    model: 'grok-4.3',\n    max_tokens: 2048,\n    reasoning_effort: 'low',\n    label: 'Grok 4.3',\n    emoji: '🚀',\n  },\n  grok46: {\n    provider: 'xai',\n    model: 'grok-4.6',\n    max_tokens: 2048,\n    reasoning_effort: 'low',\n    label: 'Grok 4.6',\n    emoji: '🚀',\n  },\n",
              1,
          )

          # App routing: both xAI gameplay models use the dedicated Grok prompt.
          replace(
              'src/App.jsx',
              "  const [selectedModel, setSelectedModel] = useState('sonnet'); // sonnet, haiku, gpt (Sol), terra, grok",
              "  const [selectedModel, setSelectedModel] = useState('sonnet'); // sonnet, haiku, gpt (Sol), terra, grok, grok46",
              1,
          )
          replace(
              'src/App.jsx',
              ": selectedModel === 'grok'\n        ? buildSystemPromptGrok",
              ": (selectedModel === 'grok' || selectedModel === 'grok46')\n        ? buildSystemPromptGrok",
              2,
          )
          replace(
              'src/App.jsx',
              "onToggleModel={() => setSelectedModel(m => m === 'sonnet' ? 'haiku' : m === 'haiku' ? 'gpt' : m === 'gpt' ? 'terra' : m === 'terra' ? 'grok' : 'sonnet')}",
              "onToggleModel={() => setSelectedModel(m => m === 'sonnet' ? 'haiku' : m === 'haiku' ? 'gpt' : m === 'gpt' ? 'terra' : m === 'terra' ? 'grok' : m === 'grok' ? 'grok46' : 'sonnet')}",
              1,
          )

          # Fresh-campaign chooser.
          replace(
              'src/components/modals/StartModal.jsx',
              "    { id:'grok', label:'🚀 Grok 4.3', provider:'xAI', enabled:hasXAI },\n",
              "    { id:'grok', label:'🚀 Grok 4.3', provider:'xAI', enabled:hasXAI },\n    { id:'grok46', label:'🚀 Grok 4.6', provider:'xAI', enabled:hasXAI },\n",
              1,
          )

          # Sidebar cycle / label.
          replace(
              'src/components/sidebar/SettingsPanel.jsx',
              "borderColor:selectedModel==='sonnet'?colors.gold:(selectedModel==='gpt'||selectedModel==='terra')?'#7aa7ff':selectedModel==='grok'?'#9ad17b':colors.border",
              "borderColor:selectedModel==='sonnet'?colors.gold:(selectedModel==='gpt'||selectedModel==='terra')?'#7aa7ff':(selectedModel==='grok'||selectedModel==='grok46')?'#9ad17b':colors.border",
              1,
          )
          replace(
              'src/components/sidebar/SettingsPanel.jsx',
              "{selectedModel==='sonnet' ? '✨ DM: Sonnet' : selectedModel==='haiku' ? '⚡ DM: Haiku' : selectedModel==='gpt' ? '🧠 DM: GPT Sol' : selectedModel==='terra' ? '🌍 DM: GPT Terra' : '🚀 DM: Grok 4.3'}",
              "{selectedModel==='sonnet' ? '✨ DM: Sonnet' : selectedModel==='haiku' ? '⚡ DM: Haiku' : selectedModel==='gpt' ? '🧠 DM: GPT Sol' : selectedModel==='terra' ? '🌍 DM: GPT Terra' : selectedModel==='grok46' ? '🚀 DM: Grok 4.6' : '🚀 DM: Grok 4.3'}",
              1,
          )

          # Screenshot support and token-cost display for the new xAI model.
          replace(
              'src/components/InputBar.jsx',
              "  grok:     { input: 1.25, output: 2.50, cacheWrite: 1.25, cacheRead: 0.20 },\n",
              "  grok:     { input: 1.25, output: 2.50, cacheWrite: 1.25, cacheRead: 0.20 },\n  grok46:   { input: 2.00, output: 6.00, cacheWrite: 2.00, cacheRead: 0.50 },\n",
              1,
          )
          replace(
              'src/components/InputBar.jsx',
              "  const xaiModel = selectedModel === 'grok';",
              "  const xaiModel = selectedModel === 'grok' || selectedModel === 'grok46';",
              1,
          )

          # Remove this temporary workflow in the same patch commit.
          Path('.github/workflows/patch-grok-46.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Grok 4.6 DM option"
          git push origin HEAD:grok-provider
