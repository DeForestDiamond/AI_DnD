name: Fix campaign opening usage logging
on:
  push:
    branches: [grok-provider]
    paths: ['.github/workflows/fix-opening-usage.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider
          fetch-depth: 0
      - name: Patch stale opening usage call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = "      if (usage) setTokenUsage(usage);"
          new = "      if (usage) appendTokenCostEntry('campaign opening', usage, { includeCacheChanges:true });"
          assert s.count(old) == 1, f'expected one stale setTokenUsage call, found {s.count(old)}'
          s = s.replace(old, new)
          assert 'setTokenUsage(' not in s
          p.write_text(s)
          PY
          git diff --check
          npm ci
          npm run build
          git rm .github/workflows/fix-opening-usage.yml
          git add src/App.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix campaign opening usage logging'
          git push origin grok-provider
