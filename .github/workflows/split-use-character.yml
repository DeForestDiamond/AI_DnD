name: Split useCharacter modules
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Split character hook into focused modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          src = Path('src/hooks/useCharacter.js')
          s = src.read_text()

          stat_mark = '// -- Pure stat helpers ----------------------------------------------------------'
          item_mark = '// -- Item / slot helpers --------------------------------------------------------'
          migration_mark = '// -- Save migration -------------------------------------------------------------'
          defaults_mark = '// -- Empty character ------------------------------------------------------------'
          hook_mark = '// -- The hook -------------------------------------------------------------------'
          for mark in (stat_mark, item_mark, migration_mark, defaults_mark, hook_mark):
              if mark not in s:
                  raise SystemExit(f'Missing useCharacter section marker: {mark}')

          stat_i = s.index(stat_mark)
          item_i = s.index(item_mark)
          migration_i = s.index(migration_mark)
          defaults_i = s.index(defaults_mark)
          hook_i = s.index(hook_mark)

          stats = s[stat_i:item_i]
          items = s[item_i:migration_i]
          migration = s[migration_i:defaults_i]
          defaults = s[defaults_i:hook_i]
          hook = s[hook_i:]

          # Equipment-dependent HP helpers belong with item/equipment math. Keeping
          # them out of stats.js also avoids a stats <-> items circular import.
          gear_start = stats.index('// CON granted by equipped gear')
          gear_end = stats.index('export const applyRaceBonus')
          gear_block = stats[gear_start:gear_end]
          stats = stats[:gear_start] + stats[gear_end:]
          items = items.replace('// Accumulated SKILL bonuses from equipped gear', gear_block + '\n// Accumulated SKILL bonuses from equipped gear', 1)

          out = Path('src/hooks/character')
          out.mkdir(parents=True, exist_ok=True)

          (out / 'stats.js').write_text(
              "import { XP_THRESHOLDS, HP_PER_LEVEL, HP_BASE } from '../../constants/progression.js';\n\n" + stats
          )
          (out / 'items.js').write_text(
              "import { SLOTS } from '../../constants/items.js';\n"
              "import { stackHas, stackNames } from '../../utils/itemStacks.js';\n"
              "import { statMod } from './stats.js';\n\n" + items
          )
          (out / 'migration.js').write_text(
              "import { ITEM_DB, EMPTY_SLOTS } from '../../constants/items.js';\n"
              "import { SAVE_VERSION } from '../../constants/progression.js';\n"
              "import { resolveArcLocation } from '../../constants/encounters.js';\n"
              "import { normalizeStacks, addStack } from '../../utils/itemStacks.js';\n"
              "import { pruneDeadItemDefinitions } from './items.js';\n\n" + migration
          )
          (out / 'defaults.js').write_text(
              "import { EMPTY_SLOTS } from '../../constants/items.js';\n"
              "import { SAVE_VERSION } from '../../constants/progression.js';\n\n" + defaults
          )
          hook_imports = """import { useState, useRef, useEffect } from 'react';
          import { SLOTS, EMPTY_SLOTS, parseDMItem } from '../../constants/items.js';
          import { STARTING_GEAR } from '../../constants/classes.js';
          import { parseCoinAmount } from '../../constants/currency.js';
          import { rollArc } from '../../constants/encounters.js';
          import { normalizeStacks, stackCount, stackHas, stackNames, addStack, takeStack, takeAllStack, renameStack } from '../../utils/itemStacks.js';
          import { calcMaxHp, applyRaceBonus } from './stats.js';
          import { allItems, effectiveMaxHp, reconcileHp, pruneDeadItemDefinitions } from './items.js';
          import { migrateCharacter } from './migration.js';
          import { EMPTY_CHAR } from './defaults.js';

          """
          (out / 'useCharacter.js').write_text(hook_imports + hook)

          src.write_text("""export * from './character/stats.js';
          export * from './character/items.js';
          export * from './character/migration.js';
          export * from './character/defaults.js';
          export { useCharacter } from './character/useCharacter.js';
          """)

          save = Path('src/hooks/useSave.js')
          save_text = save.read_text()
          old = "import { migrateCharacter } from './useCharacter.js';"
          new = "import { migrateCharacter } from './character/migration.js';"
          if old not in save_text:
              raise SystemExit('useSave migrateCharacter import not found')
          save.write_text(save_text.replace(old, new, 1))

          # The three prebuild patch scripts were migration tools whose changes are
          # already baked into source. Once useCharacter is split, at least the loot
          # patch cannot locate its old monolithic target, so stop executing patch
          # migrations on every dev/build. Keep /scripts for a separate audit.
          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data.get('scripts', {}).pop('predev', None)
          data.get('scripts', {}).pop('prebuild', None)
          pkg.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Syntax check character modules
        run: |
          node --check src/hooks/character/stats.js
          node --check src/hooks/character/items.js
          node --check src/hooks/character/migration.js
          node --check src/hooks/character/defaults.js
          node --check src/hooks/character/useCharacter.js
          node --check src/hooks/useSave.js
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit split and retire migration
        run: |
          rm -f .github/workflows/split-use-character.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hooks/useCharacter.js src/hooks/useSave.js src/hooks/character package.json .github/workflows/split-use-character.yml
          git commit -m "Split useCharacter into focused modules"
          git push
