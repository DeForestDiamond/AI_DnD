name: Add salvage selection and destination controls
on:
  push:
    branches: [inventory-consolidation]
    paths: ['.github/workflows/add-salvage-selection-destination.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-consolidation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/components/Sidebar.jsx')
          s=p.read_text()
          s=s.replace("const salvageStore = { selected: persistedSel.salvage || {}, result:null, status:'', filter:'', source:'both', showAll:false, draft:{}, infoOpen:{}, catClosed:{} };", "const salvageStore = { selected: persistedSel.salvage || {}, result:null, status:'', filter:'', source:'both', destination:'inventory', showAll:false, draft:{}, infoOpen:{}, catClosed:{} };")
          s=s.replace("  const [source, setSource]     = useStored(salvageStore, 'source');   // inventory | stash | both\n", "  const [source, setSource]     = useStored(salvageStore, 'source');   // inventory | stash | both\n  const [destination, setDestination] = useStored(salvageStore, 'destination'); // recovered materials\n")
          s=s.replace("      const got = onExecuteDismantle(result, submitted());", "      const got = onExecuteDismantle(result, submitted(), destination);")
          marker="""      {hiddenCount > 0 && (\n        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:colors.textDim,marginBottom:6,cursor:'pointer'}}>\n          <input type=\"checkbox\" checked={showAll} onChange={()=>setShowAll(v=>!v)} style={{accentColor:colors.gold,flexShrink:0}}/>\n          Show all items ({hiddenCount} hidden)\n        </label>\n      )}\n\n      <div style={{maxHeight:340"""
          insert="""      {hiddenCount > 0 && (\n        <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:colors.textDim,marginBottom:6,cursor:'pointer'}}>\n          <input type=\"checkbox\" checked={showAll} onChange={()=>setShowAll(v=>!v)} style={{accentColor:colors.gold,flexShrink:0}}/>\n          Show all items ({hiddenCount} hidden)\n        </label>\n      )}\n\n      <div style={{display:'flex',gap:4,marginBottom:6,alignItems:'center'}}>\n        <span style={{fontSize:10,color:colors.textGhost,flexShrink:0}}>RESULT TO</span>\n        {[['inventory','🎒 Inventory'],['stash','📦 Stash']].map(([id,label]) => (\n          <button key={id} onClick={()=>setDestination(id)}\n            style={{...btn(false),flex:1,fontSize:9,padding:'3px 2px',borderColor:destination===id?colors.gold:colors.borderDim,color:destination===id?colors.gold:colors.textFaint}}>\n            {label}\n          </button>\n        ))}\n      </div>\n\n      {candidates.length > 0 && (\n        <button onClick={()=>{\n          const allOn = candidates.every(([nm]) => liveSelected[nm] !== undefined);\n          setSelected(prev => {\n            const next = { ...prev };\n            candidates.forEach(([nm,max]) => { if (allOn) delete next[nm]; else next[nm] = max; });\n            return next;\n          });\n        }} style={{...btn(false),width:'100%',fontSize:10,padding:'4px 0',marginBottom:6}}>\n          {candidates.every(([nm]) => liveSelected[nm] !== undefined) ? '☐ CLEAR ALL VISIBLE' : '☑ SELECT ALL VISIBLE'}\n        </button>\n      )}\n\n      <div style={{maxHeight:340"""
          if marker not in s: raise SystemExit('salvage insertion marker not found')
          s=s.replace(marker,insert,1)
          old="""                  <span style={{fontFamily:fonts.mono,fontSize:10,color:colors.textDead}}>{rows.length} {closed ? '▼' : '▲'}</span>\n"""
          new="""                  <span style={{display:'flex',alignItems:'center',gap:5}}>\n                    <button onClick={e=>{\n                      e.stopPropagation();\n                      const allOn = rows.every(([nm]) => liveSelected[nm] !== undefined);\n                      setSelected(prev => {\n                        const next = { ...prev };\n                        rows.forEach(([nm,max]) => { if (allOn) delete next[nm]; else next[nm] = max; });\n                        return next;\n                      });\n                    }} style={{...btn(false),fontSize:8,padding:'1px 5px',lineHeight:1.3}}>\n                      {picked === rows.length ? 'CLEAR' : 'ALL'}\n                    </button>\n                    <span style={{fontFamily:fonts.mono,fontSize:10,color:colors.textDead}}>{rows.length} {closed ? '▼' : '▲'}</span>\n                  </span>\n"""
          # Replace the occurrence inside SalvagePanel only, not earlier panels.
          pos=s.index('function SalvagePanel')
          tail=s[pos:]
          if old not in tail: raise SystemExit('category control marker not found')
          tail=tail.replace(old,new,1)
          s=s[:pos]+tail
          p.write_text(s)

          p=Path('src/App.jsx')
          s=p.read_text()
          s=s.replace("  const executeDismantle = (result, submitted) => {", "  const executeDismantle = (result, submitted, destination = 'inventory') => {")
          old="""    let next = apply(applyEffects(addTags + removeTags, c));\n    updateChar(next);\n    log(`[SALVAGE] Broke down ${submitted.map(i => `${i.name} x${i.count}`).join(', ')}`);\n"""
          new="""    let next = apply(applyEffects(addTags + removeTags, c));\n    if (destination === 'stash') {\n      for (const recovered of result.recovers || []) {\n        const count = Math.max(1, Number(recovered.count) || 1);\n        next = {\n          ...next,\n          inventory: takeStack(next.inventory, recovered.name, count),\n          stash: addStack(next.stash, recovered.name, count),\n        };\n      }\n    }\n    updateChar(next);\n    log(`[SALVAGE] Broke down ${submitted.map(i => `${i.name} x${i.count}`).join(', ')}; recovery -> ${destination}`);\n"""
          if old not in s: raise SystemExit('executeDismantle marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit direct source and remove migration workflow
        run: |
          git config user.name "DeForestDiamond"
          git config user.email "120992067+DeForestDiamond@users.noreply.github.com"
          git rm .github/workflows/add-salvage-selection-destination.yml
          git add src/components/Sidebar.jsx src/App.jsx
          git commit -m "Add salvage bulk selection and recovery destination"
          git push origin inventory-consolidation
