name: Fix crafting tab crash
'on':
  push:
    branches: [feat/stacked-item-model]
    paths: [.github/workflows/fix-crafting-tab-crash.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore salvage equipped set
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.jsx')
          s=p.read_text()
          anchor="  const sourceNames = allNames.filter(nm => sourceCount(nm) > 0);\n  const stockData = (nm) => db[nm];\n  // Inverse of crafting: finished goods, not raw materials.\n"
          repl="  const sourceNames = allNames.filter(nm => sourceCount(nm) > 0);\n  const equipped = new Set(Object.values(character.slots || {}).filter(Boolean));\n  const stockData = (nm) => db[nm];\n  // Inverse of crafting: finished goods, not raw materials.\n"
          # This anchor occurs only in SalvagePanel; CraftingPanel has different following comment.
          if anchor not in s:
              raise SystemExit('salvage anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/Sidebar.jsx
          git commit -m "fix: restore equipped filter in salvage panel"
          git push
