name: Soften GPT travel prompt

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN TRAVEL PROMPT SOFTENING'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply travel prompt patch
        run: python3 scripts/patchTravelPrompt.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify travel rule
        run: |
          grep -Fq "Uneventful travel may pass uneventfully, including journeys lasting days." src/hooks/useGame.js
          grep -Fq "Do not invent encounters, complications, discoveries, or interruptions merely because the player is travelling." src/hooks/useGame.js
          ! grep -Fq "journeys of a day or more should include one concrete event or observation" src/hooks/useGame.js
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js scripts/thinGptPrompt.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Allow uneventful travel in GPT prompt"
          git push origin HEAD:main
