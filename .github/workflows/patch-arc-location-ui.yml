name: Patch arc location UI
on:
  push:
    branches: [feat/arc-locations]
    paths: ['scripts/patch_arc_location_ui.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arc-locations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/patch_arc_location_ui.py
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m 'Show arc location in debug and spoiler UI' || exit 0
          git push
