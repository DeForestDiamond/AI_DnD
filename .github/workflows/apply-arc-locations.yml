name: Apply arc locations
on:
  push:
    branches: [feat/arc-locations]
    paths: ['scripts/apply_arc_locations.py', '.github/workflows/apply-arc-locations.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arc-locations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply base patch
        run: python3 scripts/apply_arc_locations.py || true
      - name: Finish App and prompt patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text()
          old="import { rollAntagonist, encounterChance, rollEncounterDirective, PACING_ORDER } from './constants/encounters.js';"
          new="import { rollAntagonist, rollArc, makeArc, encounterChance, rollEncounterDirective, PACING_ORDER } from './constants/encounters.js';"
          if old not in s: raise SystemExit('App encounter import marker missing')
          s=s.replace(old,new,1)
          s=s.replace('const charWithArc = { ...char, arc: { antagonist: arcAntagonist } };','const charWithArc = { ...char, arc: makeArc(arcAntagonist) };',1)
          s=s.replace('const a = rollAntagonist(charRef.current.level, charRef.current.arc?.antagonist, charRef.current.defeatedAntagonists);\n              updateChar({ ...charRef.current, arc: { antagonist: a } });\n              log(`[ARC] Rolled by player — new antagonist: ${a}`);','const arc = rollArc(charRef.current.level, charRef.current.arc?.antagonist, charRef.current.defeatedAntagonists);\n              updateChar({ ...charRef.current, arc });\n              log(`[ARC] Rolled by player — new antagonist: ${arc.antagonist} @ ${arc.arcLocation}`);',1)
          s=s.replace('updateChar({ ...charRef.current, arc: { antagonist: text } });','updateChar({ ...charRef.current, arc: makeArc(text) });',1)
          p.write_text(s)

          p=Path('src/hooks/useGame.js'); s=p.read_text()
          needle='ACTIVE ARC ANTAGONIST (HIDDEN — never name or reveal them directly until the story does): ${char.arc.antagonist}.\n'
          if needle not in s: raise SystemExit('arc prompt marker missing')
          addition=needle + 'ARC LOCATION (HIDDEN CAMPAIGN STATE): ${char.arc.arcLocation || \'Faerûn\'}. This is the destination where the assigned antagonist arc ultimately leads. If the player is not there, progressively provide believable clues and ways to reach it — roads, ships, guides, portals, spells, NPC knowledge, or other setting-appropriate travel. Never teleport or railroad the player there. If the location seems bizarre for the antagonist, MAKE THE COMBINATION MAKE SENSE IN-WORLD rather than changing either fact.\n'
          p.write_text(s.replace(needle, addition, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m 'Add persistent arc locations' || exit 0
          git push
