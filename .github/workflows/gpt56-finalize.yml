name: GPT-5.6 finalization

on:
  push:
    branches:
      - feat/gpt-provider
    paths:
      - .github/workflows/gpt56-finalize.yml
      - .github/scripts/gpt56_finalize.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpt-provider
          fetch-depth: 0
      - run: python3 .github/scripts/gpt56_finalize.py
      - run: npm ci && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js src/components/InputBar.jsx
          git commit -m "Use GPT-5.6 Sol and current cache pricing"
          git push origin feat/gpt-provider
