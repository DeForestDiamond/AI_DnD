name: Refactor Sidebar

on:
  push:
    branches: [gpt-prompt-split]
    paths:
      - scripts/refactorSidebar.mjs

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Split Sidebar into focused modules
        run: node scripts/refactorSidebar.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit refactor and retire migration
        run: |
          rm -f scripts/refactorSidebar.mjs .github/workflows/refactor-sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Split Sidebar into focused modules"
          git push origin HEAD:gpt-prompt-split
