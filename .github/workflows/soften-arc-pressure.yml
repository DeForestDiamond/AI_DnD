name: Soften arc pressure
'on':
  push:
    branches: [main]
    paths: [.github/workflows/soften-arc-pressure.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch arc pacing and motivation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/hooks/useGame.js')
          s=p.read_text()
          old='''IF THIS ANTAGONIST IS NOT YET PRESENT IN THE STORY, INTRODUCE IT. This antagonist was assigned by the system and is your job to weave in — not to ignore. If the current scene has nothing to do with it, begin connecting toward it NOW: a sign of its presence, a rumor, a victim, a job that brushes against it, an encounter with its agents. Do NOT run an unrelated plotline while this antagonist sits unused. If you have been ignoring it, start tying the current events to it this turn. Whatever the player is currently doing, this antagonist is the thread underneath it.
THE ACTIVE ARC IS THE CAMPAIGN'S PRIMARY NARRATIVE THREAD. EVERY SCENE, SIDE QUEST, RANDOM ENCOUNTER, NPC INTERACTION, AND PLAYER-DIRECTED DETOUR MUST EITHER ADVANCE THE ACTIVE ARC DIRECTLY OR CREATE A CONCRETE REASON, CLUE, RESOURCE, CONTACT, CONSEQUENCE, OR OPPORTUNITY THAT MOVES THE STORY TOWARD THE ACTIVE ANTAGONIST AND ARC LOCATION. NEVER PAUSE, REPLACE, FORGET, OR WAIT FOR THE PLAYER TO REINTRODUCE THE ACTIVE ARC. THE PLAYER ALWAYS CHOOSES THEIR ACTIONS; YOU CONTROL HOW THE WORLD RESPONDS, AND THE WORLD MUST KEEP THE ACTIVE ARC MOVING FORWARD.
IF THE PLAYER IS NOT AT OR MOVING TOWARD THE ARC LOCATION, INTRODUCE AN ORGANIC AND CONCRETE REASON TO MOVE TOWARD IT. DO THIS WITHOUT ASKING THE PLAYER WHETHER THEY WANT TO PURSUE THE ARC. DO NOT TREAT A SIDE QUEST, DETOUR, BUSINESS, PERSONAL GOAL, OR RANDOM EVENT AS AN EXEMPT STORYLINE. IT MUST STILL CONNECT BACK TO THE ACTIVE ANTAGONIST OR MOVE THE PLAYER TOWARD THE ARC LOCATION.

GIVE THE PLAYER A REASON TO CARE — AND IT IS NEVER SYMPATHY. The player's character is selfish, pragmatic, and NOT a hero. They do not help the helpless, rescue children, avenge strangers, or right wrongs. A sad orphan, a missing father, a grieving widow, a village in peril — these are NOT hooks for this character and must NEVER be offered as the reason to act. They will be ignored, and rightly so.
The ONLY valid hooks are things that serve the player directly: paid coin or a lucrative contract, a threat to the player's OWN property, people, or operations, a debt owed to or by them, blackmail leverage they can use, a personal grudge or insult, a rival cutting into their interests, or something valuable the antagonist has that the player wants. The stake must be on the table BEFORE you expect the player to engage — establish who is paying, what's threatened, or what's to be gained, concretely, up front. No selfish stake, no quest. A problem merely existing, or a person merely suffering, is not a reason for THIS character to lift a finger.
'''
          new='''THE ACTIVE ARC MUST REMAIN PRESENT AND PROGRESS THROUGH THE WORLD, BUT DO NOT CONSTANTLY PUSH THE PLAYER DIRECTLY TOWARD THE ANTAGONIST. Build the arc gradually through consequences, rumors, NPC actions, discoveries, opportunities, and changes in the world. Allow breathing room between arc beats. Side quests, businesses, personal goals, and detours are allowed to breathe on their own; they do not need an antagonist clue stapled onto every scene. The antagonist should remain the campaign's underlying major threat, not a quest marker that interrupts everything else.

USE THREE STAGES: AWARENESS → INVESTMENT → PURSUIT.
AWARENESS: Let the player learn that something is happening through organic signs, rumors, victims, agents, consequences, or changes in the world. Do not assume awareness creates obligation.
INVESTMENT: BEFORE expecting the player to pursue the active antagonist, give THIS player character a concrete personal reason to care. A problem merely existing is NOT sufficient motivation. Use the character's supplied DISPOSITION as authoritative: their values, relationships, property, obligations, interests, goals, curiosity, profit motive, rivalries, grudges, lines they will not cross, or consequences of their own actions. Do NOT assume heroism, altruism, civic duty, or responsibility simply because people are in danger. Anything listed as INDIFFERENT TO is not a valid hook. The reason to care must fit this character specifically, not a generic adventurer.
PURSUIT: Once the PLAYER CHOOSES to engage with the arc, provide clear, concrete leads toward the antagonist and ARC LOCATION. At that point, travel clues, contacts, routes, portals, jobs, agents, and escalating consequences may guide them strongly — but still preserve player agency.

IF THE PLAYER IS NOT PURSUING THE ARC, DO NOT REPEATEDLY DIRECT THEM TOWARD IT. Let the antagonist's plans continue offscreen and periodically show organic consequences or connections that create NEW reasons to become involved. Do not repeat the same hook, warning, destination, or suggestion every turn. Never interpret declining, ignoring, or postponing an arc hook as permission to nag the player with it. The world can move; the player decides when they bite.
'''
          if old not in s:
              raise SystemExit('arc pressure block not found')
          p.write_text(s.replace(old,new,1))
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/hooks/useGame.js
          git commit -m "fix: pace antagonist arcs around player investment"
          git push
