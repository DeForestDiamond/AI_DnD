name: Soften arc pressure
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/soften-arc-pressure.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prompt
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/hooks/useGame.js')
          s = p.read_text()
          start = s.index('IF THIS ANTAGONIST IS NOT YET PRESENT IN THE STORY, INTRODUCE IT.')
          end = s.index('ARC COMPLETION — CHECK EVERY MESSAGE', start)
          new = """THE ACTIVE ARC MUST REMAIN PRESENT AND PROGRESS THROUGH THE WORLD, BUT DO NOT CONSTANTLY PUSH THE PLAYER DIRECTLY TOWARD THE ANTAGONIST. Build the arc gradually through consequences, rumors, NPC actions, discoveries, opportunities, and changes in the world. Allow breathing room between arc beats. Side quests, businesses, personal goals, and detours are allowed to breathe on their own; they do not need an antagonist clue stapled onto every scene. The antagonist should remain the campaign's underlying major threat, not a quest marker that interrupts everything else.\n\nUSE THREE STAGES: AWARENESS -> INVESTMENT -> PURSUIT.\nAWARENESS: Let the player learn that something is happening through organic signs, rumors, victims, agents, consequences, or changes in the world. Do not assume awareness creates obligation.\nINVESTMENT: BEFORE expecting the player to pursue the active antagonist, give THIS player character a concrete personal reason to care. A problem merely existing is NOT sufficient motivation. Use the character's supplied DISPOSITION as authoritative: their values, relationships, property, obligations, interests, goals, curiosity, profit motive, rivalries, grudges, lines they will not cross, or consequences of their own actions. Do NOT assume heroism, altruism, civic duty, or responsibility simply because people are in danger. Anything listed as INDIFFERENT TO is not a valid hook. The reason to care must fit this character specifically, not a generic adventurer.\nPURSUIT: Once the PLAYER CHOOSES to engage with the arc, provide clear, concrete leads toward the antagonist and ARC LOCATION. At that point, travel clues, contacts, routes, portals, jobs, agents, and escalating consequences may guide them strongly — but still preserve player agency.\n\nIF THE PLAYER IS NOT PURSUING THE ARC, DO NOT REPEATEDLY DIRECT THEM TOWARD IT. Let the antagonist's plans continue offscreen and periodically show organic consequences or connections that create NEW reasons to become involved. Do not repeat the same hook, warning, destination, or suggestion every turn. Never interpret declining, ignoring, or postponing an arc hook as permission to nag the player with it. The world can move; the player decides when they bite.\n\n"""
          p.write_text(s[:start] + new + s[end:])
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/hooks/useGame.js
          git commit -m "fix: pace antagonist arcs around player investment"
          git push
