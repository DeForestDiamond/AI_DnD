name: Fix summary initialization order
on:
  push:
    branches: [gpt-prompt-split]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Move summary state before manager creation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          decl = """  const SUMMARIZE_AFTER   = 12;\n  const KEEP_RECENT       = 4;\n  const ENTRIES_BEFORE_COMPRESS = 6;\n  const COMPRESS_KEEP_RECENT_ENTRIES = 2;\n  const lastSummarizedAt = useRef(0);\n\n"""
          if s.count(decl) != 1:
              raise SystemExit(f'Expected one summary declaration block, found {s.count(decl)}')
          s = s.replace(decl, '', 1)
          anchor = "  const storySummaryRef = useRef('');\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one storySummaryRef anchor, found {s.count(anchor)}')
          s = s.replace(anchor, anchor + "\n" + decl, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: npm run build
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-summary-init-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx .github/workflows/fix-summary-init-order.yml
          git commit -m "Fix summary manager initialization order"
          git push