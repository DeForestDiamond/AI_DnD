name: Refactor App managers
on:
  push:
    branches: [gpt-prompt-split]
    paths: ['.github/workflows/refactor-app-managers.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract App managers
        run: node scripts/refactorAppManagers.mjs
      - name: Verify production bundle
        run: npx vite build
      - name: Remove one-shot migration files
        run: rm scripts/refactorAppManagers.mjs .github/workflows/refactor-app-managers.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract App subsystems into manager helpers"
          git push origin HEAD:gpt-prompt-split