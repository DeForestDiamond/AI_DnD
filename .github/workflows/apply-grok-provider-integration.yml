name: Apply Grok provider integration

on:
  push:
    branches:
      - grok-provider
    paths:
      - '.github/workflows/apply-grok-provider-integration.yml'
      - 'scripts/grok-patch.part-*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: grok-provider
          fetch-depth: 0

      - name: Assemble and apply patch
        shell: bash
        run: |
          cat scripts/grok-patch.part-* > /tmp/grok-provider.patch
          git apply --check /tmp/grok-provider.patch
          git apply /tmp/grok-provider.patch
          rm -f scripts/grok-patch.part-*
          rm -f .github/workflows/apply-grok-provider-integration.yml

      - name: Commit integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire Grok provider across app"
          git push origin HEAD:grok-provider
