name: Restore inline token usage
on:
  push:
    branches:
      - grok-provider
    paths:
      - .github/workflows/restore-inline-token-usage.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-provider
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch inline usage display
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/InputBar.jsx')
          s = p.read_text()
          old_sig = "export function InputBar({ onSend, onStop, loading, isListening, sttSupported, onMicClick, isSpeaking, voiceSupported, ttsEnabled, onToggleTts, onStopSpeaking, onReplay, selectedModel }) {"
          new_sig = "export function InputBar({ onSend, onStop, loading, isListening, sttSupported, onMicClick, isSpeaking, voiceSupported, ttsEnabled, onToggleTts, onStopSpeaking, onReplay, tokenUsage, selectedModel }) {"
          if s.count(old_sig) != 1:
              raise SystemExit(f'InputBar signature count={s.count(old_sig)}')
          s = s.replace(old_sig, new_sig)

          old_tail = '''        )}
      </div>
    </div>
  );
}
'''
          new_tail = '''        )}
      </div>
      {tokenUsage && (() => {
        const inputTotal = tokenUsage.inputTokens ?? 0;
        const cacheRead = tokenUsage.cachedTokens ?? 0;
        const cacheCreate = tokenUsage.cacheWriteTokens ?? 0;
        const fresh = tokenUsage.freshTokens ?? 0;
        const output = tokenUsage.outputTokens ?? 0;
        const total = inputTotal + output;
        const cost = tokenUsage.cost ?? 0;
        const cellStyle = {
          minWidth:0,
          whiteSpace:'nowrap',
          fontSize:10,
          color:'rgba(150,130,90,0.65)',
          fontFamily:fonts.display,
          letterSpacing:0.8,
        };
        const labelStyle = {
          color:'rgba(150,130,90,0.42)',
          marginRight:5,
        };
        const cells = [
          ['INPUT', inputTotal.toLocaleString()],
          ['CACHE HIT', cacheRead.toLocaleString()],
          ['CACHE WRITE', cacheCreate.toLocaleString()],
          ['FRESH', fresh.toLocaleString()],
          ['OUTPUT', output.toLocaleString()],
          ['TOTAL', total.toLocaleString()],
          ['COST', `$${cost < 0.01 ? cost.toFixed(4) : cost.toFixed(3)}`],
        ];

        return (
          <div style={{marginTop:5,paddingTop:6,borderTop:`1px solid rgba(74,56,32,0.3)`,overflowX:'auto'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7, minmax(105px, 1fr))',columnGap:14,minWidth:820}}>
              {cells.map(([label, value]) => (
                <div key={label} style={cellStyle}>
                  <span style={labelStyle}>{label}</span>{value}
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}
'''
          if s.count(old_tail) != 1:
              raise SystemExit(f'InputBar tail count={s.count(old_tail)}')
          p.write_text(s.replace(old_tail, new_tail))

          p = Path('src/App.jsx')
          s = p.read_text()
          old = '''          onReplay={() => {
            const lastDM = [...fullLog].reverse().find(m => m.role === 'dm');
            if (lastDM) voice.speak(lastDM.text);
          }}
          selectedModel={selectedModel}
'''
          new = '''          onReplay={() => {
            const lastDM = [...fullLog].reverse().find(m => m.role === 'dm');
            if (lastDM) voice.speak(lastDM.text);
          }}
          tokenUsage={[...tokenCostLog].reverse().find(e => e.requestType === 'gameplay' || e.requestType === 'campaign opening') || null}
          selectedModel={selectedModel}
'''
          if s.count(old) != 1:
              raise SystemExit(f'App InputBar prop anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-inline-token-usage.yml
          git add src/App.jsx src/components/InputBar.jsx
          git commit -m "Restore inline token and cost usage"
          git push