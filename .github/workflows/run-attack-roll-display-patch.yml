name: Run attack roll display patch

on:
  push:
    paths:
      - 'scripts/patchAttackRollDisplay.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patchAttackRollDisplay.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify attack rolls are attached to messages
        run: grep -q "skillRoll || actionRoll" src/App.jsx
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Show player attack rolls in message feed"
          git push origin HEAD:main
