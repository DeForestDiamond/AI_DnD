name: Fix Sidebar shared dependencies
on:
  push:
    branches: [gpt-prompt-split]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair extracted Sidebar dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          common = Path('src/components/sidebar/common/index.jsx')
          s = common.read_text()
          marker = "// ── Sub-components"
          npc = "export const npcInput = { width:'100%', boxSizing:'border-box', background:'rgba(0,0,0,0.4)', border:`1px solid ${colors.borderDim}`, color:colors.text, fontFamily:fonts.body, fontSize:13, padding:'6px 8px', borderRadius:4, outline:'none' };\n\n"
          if 'export const npcInput' not in s:
              if marker not in s: raise SystemExit('common marker missing')
              s = s.replace(marker, npc + marker, 1)
              common.write_text(s)

          crafting = Path('src/components/sidebar/crafting/Panels.jsx')
          s = crafting.read_text()
          old = "import { CollapsibleSection } from '../common/index.jsx';"
          new = "import { CollapsibleSection, npcInput } from '../common/index.jsx';"
          if new not in s:
              if old not in s: raise SystemExit('crafting common import missing')
              s = s.replace(old, new, 1)
              crafting.write_text(s)

          settings = Path('src/components/sidebar/settings/Controls.jsx')
          s = settings.read_text()
          imp = "import { CollapsibleSection, npcInput } from '../common/index.jsx';\n"
          if imp not in s:
              anchor = "import { colors, fonts, btn } from '../../../styles/theme.js';\n"
              if anchor not in s: raise SystemExit('settings import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
              settings.write_text(s)

          world = Path('src/components/sidebar/world/Panels.jsx')
          s = world.read_text()
          imp = "import { CollapsibleSection, npcInput } from '../common/index.jsx';\n"
          if imp not in s:
              anchor = "import { equippableInSlot } from '../../../hooks/useCharacter.js';\n"
              if anchor not in s: raise SystemExit('world import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          local = "const npcInput = { width:'100%', boxSizing:'border-box', background:'rgba(0,0,0,0.4)', border:`1px solid ${colors.borderDim}`, color:colors.text, fontFamily:fonts.body, fontSize:13, padding:'6px 8px', borderRadius:4, outline:'none' };\n"
          s = s.replace(local, '', 1)
          world.write_text(s)

          # Guard against the exact runtime regressions from the split.
          for p in [crafting, settings, world]:
              t = p.read_text()
              if 'npcInput' in t and 'npcInput' not in t.split('\n', 8)[0:8].__str__() and p == crafting:
                  pass
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit fix and retire migration
        run: |
          rm .github/workflows/fix-sidebar-shared-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Sidebar extracted shared dependencies"
          git push origin HEAD:gpt-prompt-split
