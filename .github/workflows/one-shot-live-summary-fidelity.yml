name: One-shot live summary fidelity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply live summary fidelity change
        run: node scripts/oneShotLiveSummaryFidelity.mjs
      - name: Build
        run: npm ci && npm run build
      - name: Commit direct source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Expand live summaries and preserve boundary context"
          git push origin HEAD:main
