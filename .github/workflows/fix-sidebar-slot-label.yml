name: Fix Sidebar slot label

on:
  push:
    branches: [gpt-prompt-split]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-split
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore slot item label import
        run: node scripts/fixSidebarSlotItemLabel.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit fix and retire migration
        run: |
          rm -f scripts/fixSidebarSlotItemLabel.mjs .github/workflows/fix-sidebar-slot-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Sidebar slot item label import"
          git push origin HEAD:gpt-prompt-split
