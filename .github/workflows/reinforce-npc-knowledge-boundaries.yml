name: Reinforce NPC knowledge boundaries

on:
  push:
    branches: [divine-deity-roll]
    paths:
      - '.github/workflows/reinforce-npc-knowledge-boundaries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: divine-deity-roll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/reinforce_npc_knowledge_boundaries.py
      - run: npm ci
      - run: npm run build
      - name: Verify NPC knowledge rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/hooks/useGame.js').read_text()
          assert 'PLAYER KNOWLEDGE DOES NOT SPREAD AUTOMATICALLY.' in s
          assert 'CAMPAIGN HISTORY IS DM MEMORY, NOT WORLDWIDE NPC MEMORY.' in s
          assert 'A secret assassination in Calimport is not automatically known to a shady merchant in Waterdeep.' in s
          print('NPC knowledge boundary rules verified')
          PY
      - run: rm -f .github/scripts/reinforce_npc_knowledge_boundaries.py .github/workflows/reinforce-npc-knowledge-boundaries.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reinforce NPC knowledge boundaries' || exit 0
          git push origin HEAD:divine-deity-roll
# trigger
