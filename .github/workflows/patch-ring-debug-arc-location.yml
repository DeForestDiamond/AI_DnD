name: Patch ring debug and arc location
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patches
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.jsx')
          s = app.read_text()

          old = 'waist ring1 ring2 feet — omit for weapon/consumable'
          new = 'waist ring feet — omit for weapon/consumable'
          assert s.count(old) == 1, f'Expected exactly one ring slot shape anchor, found {s.count(old)}'
          s = s.replace(old, new, 1)

          old = 'an amulet is magic/neck, a ring is magic/ring1.'
          new = 'an amulet is magic/neck, a ring is magic/ring.'
          assert s.count(old) == 1, f'Expected exactly one ring rule anchor, found {s.count(old)}'
          s = s.replace(old, new, 1)

          old = """    const { removeTags, apply, bagTakes } = consumeMaterials(c, consumes);\n    let next = apply(applyEffects(tag + removeTags, c));\n"""
          new = """    const { removeTags, apply, bagTakes } = consumeMaterials(c, consumes);\n    log(`[CRAFT TAG] ${tag}`);\n    let next = apply(applyEffects(tag + removeTags, c));\n"""
          assert s.count(old) == 1, f'Expected exactly one craft apply anchor, found {s.count(old)}'
          s = s.replace(old, new, 1)
          app.write_text(s)

          game = Path('src/hooks/useGame.js')
          g = game.read_text()
          old = """ARC LOCATION (HIDDEN CAMPAIGN STATE): ${char.arc.arcLocation || 'Faerûn'}. This is the destination where the assigned antagonist arc ultimately leads. If the player is not there, progressively provide believable clues and ways to reach it — roads, ships, guides, portals, spells, NPC knowledge, or other setting-appropriate travel. Never teleport or railroad the player there. If the location seems bizarre for the antagonist, MAKE THE COMBINATION MAKE SENSE IN-WORLD rather than changing either fact."""
          new = """ARC LOCATION (HIDDEN CAMPAIGN STATE): ${char.arc.arcLocation || 'Faerûn'}. THIS IS WHERE THE SUBSTANTIVE ARC HAPPENS, not merely a place to reference. If the player is elsewhere, their current location may provide a BRIEF hook — a survivor, rumor, message, clue, witness, map, coordinates, portal lead, or other believable reason to travel — but DO NOT relocate the antagonist's actual operation to wherever the player happens to be. Once the player chooses to engage, give them a concrete route or lead toward the ARC LOCATION and let them choose how to get there; do not pad travel unnecessarily. DO NOT MAKE THE CURRENT LOCATION CONVENIENTLY CONTAIN THE QUEST: attacks, evidence, agents, NPCs, and major encounters must not repeatedly materialize beside the player merely to avoid changing locations. The arc's meaningful investigation, confrontation, and consequences should occur in or genuinely connect to the assigned ARC LOCATION. Never teleport or railroad the player there. If the location seems bizarre for the antagonist, MAKE THE COMBINATION MAKE SENSE IN-WORLD rather than changing either fact."""
          assert g.count(old) == 1, f'Expected exactly one arc location anchor, found {g.count(old)}'
          g = g.replace(old, new, 1)
          game.write_text(g)
      - name: Verify intended edits
        shell: bash
        run: |
          grep -F 'waist ring feet — omit for weapon/consumable' src/App.jsx
          grep -F 'a ring is magic/ring.' src/App.jsx
          grep -F 'log(`[CRAFT TAG] ${tag}`);' src/App.jsx
          grep -F 'THIS IS WHERE THE SUBSTANTIVE ARC HAPPENS' src/hooks/useGame.js
          ! grep -F 'waist ring1 ring2 feet — omit for weapon/consumable' src/App.jsx
          ! grep -F 'a ring is magic/ring1.' src/App.jsx
      - name: Build
        run: npm ci && npm run build
      - name: Commit patches and remove workflow
        run: |
          rm .github/workflows/patch-ring-debug-arc-location.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix crafting ring vocabulary, tag logging, and arc travel"
          git push