name: GPT prompt cleanup

on:
  push:
    branches: [gpt-prompt-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-prompt-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Flatten GPT prompt assembly
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const gamePath = 'src/hooks/useGame.js';
          let s = fs.readFileSync(gamePath, 'utf8');

          if (!s.includes('const GPT_THREAD_DISCIPLINE = `')) {
            const marker = '// ── System Prompt — Sonnet ─────────────────────────────────────────────────────\n';
            if (!s.includes(marker)) throw new Error('Sonnet prompt marker not found');

            const threadStart = 'gptStaticInstructions += `';
            const threadIdx = s.indexOf(threadStart);
            if (threadIdx < 0) throw new Error('GPT thread block not found');
            const threadBodyStart = threadIdx + threadStart.length;
            const threadBodyEnd = s.indexOf('`;\n', threadBodyStart);
            if (threadBodyEnd < 0) throw new Error('GPT thread block end not found');
            const thread = s.slice(threadBodyStart, threadBodyEnd);

            const extraStart = "+ '\\n\\nNPC INTRODUCTIONS:";
            const extraIdx = s.indexOf(extraStart, threadBodyEnd);
            if (extraIdx < 0) throw new Error('GPT extra-rules suffix not found');
            const extraExprEnd = s.indexOf("';\n\n      const cacheBreakpoint", extraIdx);
            if (extraExprEnd < 0) throw new Error('GPT extra-rules suffix end not found');
            const quoted = s.slice(extraIdx + 2, extraExprEnd + 1);
            const extra = Function(`return ${quoted}`)().replace(/^\n\n/, '');

            const constants = `// ── GPT-only DM rules ──────────────────────────────────────────────────────────\n// These are written directly into the GPT prompt. Do not mutate the finished\n// prompt with runtime .replace() chains; what appears here is what Sol/Terra see.\nconst GPT_THREAD_DISCIPLINE = \`${thread}\`;\n\nconst GPT_EXTRA_RULES = \`${extra.replace(/`/g, '\\`').replace(/\\\$/g, '\\\\$')}\`;\n\n`;
            s = s.replace(marker, constants + marker);

            const builderHead = "export const buildSystemPromptSonnet = (char) => {\n  const cb  = buildCharBlock(char);\n  const ctx = buildCtxSections(char);";
            const builderNew = "export const buildSystemPromptSonnet = (char, { forGpt = false } = {}) => {\n  const cb  = buildCharBlock(char);\n  const ctx = buildCtxSections(char);\n  const locationContext = forGpt ? '' : `${ctx.npcSection}${ctx.townsSection}`;\n  const npcRules = forGpt ? '' : NPC_BLOCK;\n  const gptRules = forGpt ? `${GPT_THREAD_DISCIPLINE}\\n\\n${GPT_EXTRA_RULES}` : '';";
            if (!s.includes(builderHead)) throw new Error('Sonnet builder head not found');
            s = s.replace(builderHead, builderNew);

            const ctxOld = '${ctx.bio}${ctx.dispositionSection}${ctx.objectivesSection}${ctx.companionSection}${ctx.npcSection}${ctx.townsSection}';
            if (!s.includes(ctxOld)) throw new Error('Sonnet location context line not found');
            s = s.replace(ctxOld, '${ctx.bio}${ctx.dispositionSection}${ctx.objectivesSection}${ctx.companionSection}${locationContext}');

            const sonnetStart = s.indexOf('export const buildSystemPromptSonnet');
            const npcPos = s.indexOf('${NPC_BLOCK}', sonnetStart);
            if (npcPos < 0) throw new Error('Sonnet NPC_BLOCK insertion not found');
            s = s.slice(0, npcPos) + '${npcRules}' + s.slice(npcPos + '${NPC_BLOCK}'.length);

            const factionsEnd = "Powerful factions weigh costs. They do not commit total war over a slight, especially against a dangerous target — they send letters, proxies, and offers before armies, and they cut losses when the price of pressing exceeds the prize. Factions that act like accountants feel real; factions that act like karma feel like the DM's hand.`;";
            if (!s.includes(factionsEnd)) throw new Error('Sonnet static prompt end not found');
            s = s.replace(factionsEnd, factionsEnd.slice(0, -2) + '${gptRules}`;');

            const stackMarker = '// Stack duplicate inventory items for display\n';
            if (!s.includes(stackMarker)) throw new Error('Stack marker not found');
            s = s.replace(stackMarker, "export const buildSystemPromptGpt = (char) => buildSystemPromptSonnet(char, { forGpt: true });\n\n" + stackMarker);

            const runtimeStart = '      let gptStaticInstructions = hasSplit ? systemPrompt.static : systemPrompt;\n';
            const runtimeIdx = s.indexOf(runtimeStart);
            if (runtimeIdx < 0) throw new Error('Runtime GPT mutation start not found');
            const runtimeEndMarker = "';\n\n      const cacheBreakpoint";
            const runtimeEnd = s.indexOf(runtimeEndMarker, runtimeIdx);
            if (runtimeEnd < 0) throw new Error('Runtime GPT mutation end not found');
            const direct = "      // GPT arrives here with its final static instructions already assembled by\n      // buildSystemPromptGpt(). callDM only handles cache layout and transport.\n      const gptStaticInstructions = hasSplit ? systemPrompt.static : systemPrompt;\n";
            s = s.slice(0, runtimeIdx) + direct + s.slice(runtimeEnd + 3);
            s = s.replace('text: thinnedGptInstructions,', 'text: gptStaticInstructions,');

            fs.writeFileSync(gamePath, s);
          }

          const appPath = 'src/App.jsx';
          let a = fs.readFileSync(appPath, 'utf8');
          a = a.replace(
            "import { useGame, buildSystemPrompt, buildSystemPromptSonnet, cleanDisplayText, MODEL_CONFIGS } from './hooks/useGame.js';",
            "import { useGame, buildSystemPrompt, buildSystemPromptSonnet, buildSystemPromptGpt, cleanDisplayText, MODEL_CONFIGS } from './hooks/useGame.js';"
          );
          a = a.replace(
            "const prompt = selectedModel === 'sonnet'\n        ? buildSystemPromptSonnet(c)\n        : buildSystemPrompt(c);",
            "const prompt = selectedModel === 'sonnet'\n        ? buildSystemPromptSonnet(c)\n        : selectedModel === 'haiku'\n        ? buildSystemPrompt(c)\n        : buildSystemPromptGpt(c);"
          );
          a = a.replaceAll(
            "const system = selectedModel === 'haiku'\n        ? buildSystemPrompt(charWithArc)\n        : buildSystemPromptSonnet(charWithArc);",
            "const system = selectedModel === 'haiku'\n        ? buildSystemPrompt(charWithArc)\n        : selectedModel === 'sonnet'\n        ? buildSystemPromptSonnet(charWithArc)\n        : buildSystemPromptGpt(charWithArc);"
          );
          a = a.replaceAll(
            "const system = selectedModel === 'haiku'\n        ? buildSystemPrompt(charRef.current)\n        : buildSystemPromptSonnet(charRef.current);",
            "const system = selectedModel === 'haiku'\n        ? buildSystemPrompt(charRef.current)\n        : selectedModel === 'sonnet'\n        ? buildSystemPromptSonnet(charRef.current)\n        : buildSystemPromptGpt(charRef.current);"
          );
          fs.writeFileSync(appPath, a);
          NODE
      - name: Syntax check
        run: node --check src/hooks/useGame.js
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGame.js src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Flatten GPT prompt assembly"
          git push origin HEAD:gpt-prompt-cleanup
